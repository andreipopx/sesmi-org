<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>sesmi · De dónde sale la paloma</title>
<!--
  Material real (créditos en assets/*/credits.json; shared/credits.py lee estas rutas):
  ../assets/archivo/enc-escritura-ronda.jpg  ../assets/archivo/enc-escritura-pluma.jpg
  ../assets/video/ia-plumilla.mp4  ../assets/video/anim-palomas.mp4
-->
<!--
  Serie «De dónde sale cada figura», episodio 3/3: la paloma (Divulgación). Rejilla común de la serie:
  cabecera fija, caja cuadrada de 476 px con la fuente, pie con la fuente, subtítulos debajo.
  Gancho: «¿Por qué una paloma?», la caja se dibuja a saltos. n2: cartela tipográfica (REAL SOCIEDAD ECONÓMICA
  MATRITENSE · 1775, la cifra aparece a saltos con la voz) sobre una lámina de la Encyclopédie a baja opacidad.
  n3: macro de la plumilla y «Socorre enseñando» escrito con una plumilla, palabra a palabra. n4: las dos palomas de
  1895 aletean sobre negro; en «La paloma lleva el mensaje» el vuelo se detiene, la figura de marca se calca a pluma
  sobre una de ellas, la fuente se va en tres saltos, la figura se rellena, pasa al centro y aletea (ciclo de marca).
  Cierre (último episodio): la caja se borra a saltos; wordmark, sesmi.org y las tres figuras en fila con
  «Las tres patas de sesmi». Todo a pocos fps; todo es función de t. Eventos en audio.py.
-->
<link rel="stylesheet" href="../shared/base.css">
<style>
.photo img{max-width:none}
#bx{position:absolute;left:32px;top:150px;width:476px;height:476px;background:var(--paper);z-index:1;overflow:hidden}
#bx.dk{background:var(--ink)}
.plate{position:absolute;inset:0;overflow:hidden;opacity:.16}
#src{position:absolute;inset:0;z-index:2}
#ov{position:absolute;left:32px;top:150px;width:476px;height:476px;z-index:5;overflow:hidden;pointer-events:none}
#calco{position:absolute;left:0;top:0;width:476px;height:476px;overflow:visible}
#fig{position:absolute;left:0;top:0;width:100px;height:100px;transform-origin:50px 50px;color:var(--ink);visibility:hidden}
#frame{position:absolute;inset:0;width:540px;height:960px;z-index:9;overflow:visible}
#hdr{position:absolute;inset:0;z-index:10}
#hdr .lbl{position:absolute;top:64px;color:var(--ink-3);white-space:nowrap}
#hdr .l{left:32px;display:flex;align-items:center;gap:9px}
#hdr .l i{display:inline-block;width:7px;height:7px;background:var(--red)}
#hdr .r{right:32px}
.pie{position:absolute;left:32px;top:636px;color:var(--ink-3);white-space:nowrap;z-index:10}
.lema{position:absolute;left:32px;top:628px;font:italic 400 24px/1.3 var(--text);color:var(--red);z-index:10;display:none}
#q{position:absolute;left:32px;top:150px;width:476px;height:476px;z-index:6;display:flex;align-items:center;justify-content:center;
  text-align:center;font:700 62px/1.02 var(--strong);letter-spacing:-.04em}
#q span{visibility:hidden}
/* cartela de la Real Sociedad Económica Matritense */
#card{position:absolute;left:32px;top:150px;width:476px;height:476px;z-index:6;display:none;pointer-events:none}
#card .rl{position:absolute;left:44px;right:44px;height:1px;background:var(--ink)}
#card .nm{position:absolute;left:0;right:0;top:110px;text-align:center;font:500 13px/1.7 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
#card .nm span{display:block}
#card .yr{position:absolute;left:0;right:0;top:190px;text-align:center;font:500 150px/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
#card .yr span{display:inline-block;width:.6em;text-align:center;visibility:hidden}
#card .rd{position:absolute;left:234px;top:357px;width:8px;height:8px;background:var(--red);visibility:hidden}
/* lema escrito con la plumilla */
#lemaBig{position:absolute;left:32px;top:150px;width:476px;height:476px;z-index:6;display:none;pointer-events:none}
#lemaBig .ln{position:absolute;left:0;right:0;text-align:center;font:italic 400 76px/1 var(--text);letter-spacing:-.02em;color:var(--red);white-space:nowrap}
#lemaBig .ln span{display:inline-block;clip-path:inset(-20% 100% -20% 0)}
#nib{position:absolute;width:56px;height:74px;z-index:7;display:none;pointer-events:none;overflow:visible}
.subs .sub{top:690px;display:none}
.subs .sub .w{opacity:1;visibility:hidden}
#close{position:absolute;inset:0;z-index:7}
#close .abs{visibility:hidden}
#close .fg{position:absolute;width:88px;height:88px;color:var(--ink);visibility:hidden}
#close .fl{position:absolute;width:176px;text-align:center;color:var(--ink-3);white-space:nowrap;visibility:hidden}
</style>
</head>
<body>
<div id="stage">
  <div id="bx"><div class="plate" id="plate"></div><div id="src"></div></div>
  <div id="q"></div>
  <div id="card">
    <div class="rl" style="top:102px"></div>
    <div class="nm"><span>Real Sociedad Económica</span><span>Matritense</span></div>
    <div class="rl" style="top:168px"></div>
    <div class="yr" id="yr"><span>1</span><span>7</span><span>7</span><span>5</span></div>
    <div class="rl" style="top:360px"></div>
    <div class="rd" id="rd"></div>
  </div>
  <div id="lemaBig"><div class="ln" id="ln1" style="top:150px"><span>Socorre</span></div><div class="ln" id="ln2" style="top:238px"><span>enseñando.</span></div></div>
  <svg id="nib" viewBox="0 0 64 84"><path d="M30 48 L58 8" stroke="#1C1814" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M22 54 L32 40 L38 46 L28 58 Z" fill="#1C1814"/><path d="M2 82 L12 56 L22 52 L28 58 L24 64 L8 78 Z" fill="#1C1814"/><path d="M3 81 L14 58" stroke="#F7F3EE" stroke-width="1.1" fill="none"/></svg>
  <div id="ov">
    <svg id="calco" viewBox="0 0 476 476"><g id="cg"><path id="ch" fill="none" stroke="#F7F3EE" stroke-linejoin="round"/><path id="cp" fill="none" stroke="#1C1814" stroke-linejoin="round"/><rect id="pen" fill="#7A1F10"/></g></svg>
    <div id="fig"></div>
  </div>
  <svg id="frame" viewBox="0 0 540 960"><rect id="bd" x="32.5" y="150.5" width="475" height="475" fill="none" stroke="#1C1814" stroke-width="1"/></svg>
  <div id="hdr"><div class="lbl l"><i></i>De dónde sale · 3/3</div><div class="lbl r">Divulgación</div></div>
  <div class="lbl pie" id="pie"></div>
  <div class="lema" id="lema">Socorre enseñando</div>
  <div id="close"></div>
  <div class="subs" id="subs"></div>
  <div id="vig"></div>
</div>
<script src="../shared/common.js"></script>
<script>
(() => {
const { $, ev, clamp, stepN, line, wordAt } = S;
const B = window.BRAND;
const AR = "../assets/archivo/";
const show = (el, on, how = "block") => { const d = on ? how : "none"; if (el.style.display !== d) el.style.display = d; };
const vis = (el, on) => { const v = on ? "visible" : "hidden"; if (el.style.visibility !== v) el.style.visibility = v; };
const q12 = (t) => Math.floor(t * 12 + 1e-6) / 12;

// ═════ tiempos (la voz manda; tiempos tipo de la serie)
const N = { n1: line("n1").t, n2: line("n2").t, n3: line("n3").t, n4: line("n4").t, n5: line("n5").t };
const BOX = { left: 0, top: 0, width: 476, height: 476 };
const T_BOX = .55;                          // la caja se dibuja a saltos (12 fps), 0 → .55
const T_CARD = N.n2;                        // corte: la cartela de 1775 (el gancho se va)
const T_PEN = line("n2").end + .06;         // macro de la plumilla (corte seco)
const T_WRITE = N.n3;                       // corte: «Socorre enseñando» se escribe con la voz
const T_DOVES = N.n4;                       // corte: las palomas de 1895
const T_FREEZE = T_DOVES + 3.0;             // el vuelo se detiene en el fotograma que se calca
const T_TRACE = wordAt("n4", 7) - .03, TRACE_D = 1.5, T_TRACE_END = T_TRACE + TRACE_D;
const T_VANISH = T_TRACE_END + .2;          // la fuente se va en tres saltos
const T_FILL = T_VANISH + 2 / 6;            // el trazo pasa a relleno
const T_MOVE = T_FILL + .3, MOVE_D = 4 / 12; // la figura pasa al centro de la caja
const T_LIVE = T_MOVE + MOVE_D;             // y aletea
const T_ERASE = line("n5").end + .12;        // la caja se borra
const W0 = T_ERASE + .5, WS = .2083;       // wordmark, a saltos
const T_LAND = W0 + 5 * WS + .1, T_URL = T_LAND + .3;
const T_FIGS = T_LAND + .3, T_LINE = T_FIGS + .7;
const DUR = T_LINE + 1.6;
window.FIG_DURATION = DUR;
const ERASE_END = T_ERASE + .15 + .5;

// ═════ fotograma de las palomas: encuadre y calco. Imagen 608×1080 (los fotogramas), caja 476×476
const IW = 608, IH = 1080;
const KZ = 1.0;                             // px de caja por px de imagen·(476/608) → zoom relativo al ancho de la caja
const K = (BOX.width / IW) * 1.4;          // px de caja por px de imagen
const DOVE = { fx: .5, fy: .5 };
// el calco: centro de la figura en la caja, px por unidad, giro (grados)
const CAL = { cx: 252, cy: 250, s: 3.5, r: -8 };
const FINAL = { cx: 238, cy: 238, s: 3.0, r: 0 };
window.__CAL = CAL;

// ═════ planos dentro de la caja
const FPS = 6;
const srcEl = $("src");
const framing = (base, z0, z1, t0, t1, fx = .5, fy = .5) => (t) => {
  base(t);
  if (t < t0 || t >= t1) return;
  const tq = t0 + stepN(t, t0, FPS) / FPS;
  const p = clamp((tq - t0) / Math.max(.001, t1 - t0));
  const k = K * (z0 + (z1 - z0) * p);
  const W = IW * k, H = IH * k, st = base.img.style;
  st.objectFit = "fill"; st.inset = "auto"; st.maxWidth = "none"; st.transform = "none";
  st.width = W.toFixed(1) + "px"; st.height = H.toFixed(1) + "px";
  st.left = (BOX.width / 2 - fx * W).toFixed(1) + "px"; st.top = (BOX.height / 2 - fy * H).toFixed(1) + "px";
};
const O = (t0, t1, extra = {}) => ({ t0, t1, grade: "grabado", fps: FPS, parent: srcEl, z: 2, box: BOX, ...extra });
// plano de la plumilla: macro, corte seco (clip vertical 720×1280 en una caja cuadrada)
const penClip = S.clip("ia-plumilla", O(T_PEN, T_WRITE, { start: .5 }));
// palomas: vuelo hasta el fotograma que se calca (3,0 s del clip), luego fotograma fijo
const dovesPlay = framing(S.clip("anim-palomas", O(T_DOVES, T_FREEZE, { start: 0, grade: "grabado" })), 1, 1, T_DOVES, T_FREEZE, DOVE.fx, DOVE.fy);
const dovesFreeze = framing(S.clip("anim-palomas", O(T_FREEZE, T_VANISH + .5, { start: 3.0, rate: 0, grade: "grabado" })), 1, 1, T_FREEZE, T_VANISH + .5, DOVE.fx, DOVE.fy);
// láminas de la Encyclopédie, a baja opacidad, de fondo de la cartela y del lema
const plate = $("plate");
const plA = S.photo(AR + "enc-escritura-ronda.jpg", { t0: T_CARD, t1: T_PEN, grade: "grabado", fps: FPS, parent: plate, box: BOX, from: [1.0, 50, 4], to: [1.0, 50, 4] });
const plB = S.photo(AR + "enc-escritura-ronda.jpg", { t0: T_WRITE, t1: T_DOVES, grade: "grabado", fps: FPS, parent: plate, box: BOX, from: [1.08, 50, 96], to: [1.0, 50, 90] });
[T_CARD, T_PEN, T_WRITE, T_DOVES].forEach((t, i) => ev(t, "cut", i));
S.ev(T_FREEZE, "freeze");

// ═════ gancho: la pregunta en la caja, palabra a palabra
const q = $("q");
q.innerHTML = `<div><span>¿Por</span> <span>qué</span><br><span>una</span> <span>paloma?</span></div>`;
const qw = [...q.querySelectorAll("span")];
const T_Q_END = T_CARD;

// ═════ cartela: la cifra aparece a saltos con la voz (mil, setecientos, setenta, cinco)
const card = $("card"), yr = [...$("yr").querySelectorAll("span")], rd = $("rd");
const YR_AT = [1, 2, 3, 5].map((i) => wordAt("n2", i));        // mil · setecientos · setenta · cinco
const T_MAD = wordAt("n2", 9);                                  // «Madrid»
YR_AT.forEach((t, i) => ev(t, "digit", i));

// ═════ «Socorre enseñando» escrito con la plumilla
const lemaBig = $("lemaBig"), nib = $("nib");
const wr = [[$("ln1").firstElementChild, 0], [$("ln2").firstElementChild, 1]];
const L3 = line("n3");
const WRITE_SPAN = wr.map(([el, i]) => [L3.t + L3.words[i][1] - .02, L3.t + L3.words[i][2] - .05]);
WRITE_SPAN.forEach(([a, b]) => ev(a, "write", +(b - a).toFixed(2)));

// ═════ subtítulos de la voz (cada palabra aparece cuando se dice, sin fundidos)
const subs = [];
const mkSub = (id, groups, hot = []) => {
  const L = line(id);
  groups.forEach(([a, b], gi) => {
    const host = S.el("div", "sub", $("subs"));
    const ws = [];
    for (let i = a; i <= b; i++) {
      const w = S.el("span", "w" + (hot.includes(i) ? " hot" : ""), host, L.words[i][0]);
      ws.push(w); if (i < b) host.appendChild(document.createTextNode(" "));
    }
    const t0 = L.t + L.words[a][1] - .05;
    const t1 = gi < groups.length - 1 ? L.t + L.words[groups[gi + 1][0]][1] - .05 : (id === "n5" ? L.end + .25 : L.end + .6);
    subs.push((t) => {
      const on = t >= t0 && t < t1;
      show(host, on);
      if (on) ws.forEach((w, k) => vis(w, t >= L.t + L.words[a + k][1] - .02));
    });
  });
};
mkSub("n2", [[0, 5], [6, 12]], [12]);
mkSub("n4", [[0, 6], [7, 11]], [8]);
mkSub("n5", [[0, 4]], [2]);

// ═════ caja que se dibuja, calco, figura viva
const bd = $("bd"), dBd = S.dash(bd);
const cg = $("cg"), cp = $("cp"), ch = $("ch"), pen = $("pen");
cp.setAttribute("d", B.figs.paloma.mayor); ch.setAttribute("d", B.figs.paloma.mayor);
cp.setAttribute("stroke-width", (1.6 / CAL.s).toFixed(3)); ch.setAttribute("stroke-width", (4.2 / CAL.s).toFixed(3));
cg.setAttribute("transform", `translate(${CAL.cx} ${CAL.cy}) rotate(${CAL.r}) scale(${CAL.s}) translate(-50 -50)`);
const PW = 1.5; pen.setAttribute("width", PW); pen.setAttribute("height", PW);
const dCp = S.dash(cp), dCh = S.dash(ch);
const CLEN = cp.getTotalLength();
const fg = $("fig");
const figAt = S.fig(fg, "paloma", "mayor");
const place = (g) => { fg.style.transform = `translate(${(g.cx - 50).toFixed(1)}px,${(g.cy - 50).toFixed(1)}px) rotate(${g.r.toFixed(2)}deg) scale(${g.s.toFixed(3)})`; };
S.figEvents("paloma", T_LIVE, T_ERASE);
ev(T_TRACE, "trace"); ev(T_TRACE_END, "traceEnd"); ev(T_FILL, "fill");
ev(.1, "motif"); ev(W0, "motif");           // motivo de cuatro notas (74, 78, 81, 86) en el gancho y en el cierre

// ═════ cierre: wordmark, sesmi.org, las tres figuras en fila y «Las tres patas de sesmi»
const [sqx, sqy, sqw] = B.wordmark.sq.map(Number);
const cl = $("close");
const WORD = S.el("div", "abs", cl); WORD.style.cssText = "left:120px;top:262px;width:300px;visibility:hidden";
WORD.innerHTML = `<svg viewBox="${B.wordmark.vb}" style="display:block;width:100%;overflow:visible"><defs><clipPath id="wc"><rect class="wcr" x="22" y="-702" height="714" width="0"/></clipPath></defs>` +
  `<path fill="currentColor" d="${B.wordmark.d}" clip-path="url(#wc)"/><rect class="wdot" fill="#7A1F10" x="${sqx}" y="${sqy}" width="${sqw}" height="${sqw}" style="visibility:hidden"/></svg>`;
const URL_ = S.el("div", "abs", cl, "sesmi.org"); URL_.style.cssText = "left:0;right:0;top:386px;text-align:center;font:500 27px/1 var(--display)";
const RULE = S.el("div", "abs", cl); RULE.style.cssText = "left:32px;right:32px;top:470px;height:1px;background:var(--ink)";
const LINE = S.el("div", "abs", cl, `Las tres patas de <span style="font:500 24px/1 var(--display);font-style:normal;letter-spacing:-.01em">sesmi</span>`);
LINE.style.cssText = "left:0;right:0;top:488px;text-align:center;font:italic 400 24px/1.3 var(--text);color:var(--ink)";
const PATAS = [["buho", "Investigación", 90, T_FIGS], ["caballo", "Servicios", 270, T_FIGS + .22], ["paloma", "Divulgación", 450, T_FIGS + .44]];
const figs = PATAS.map(([name, label, cx, t0]) => {
  const h = S.el("div", "fg", cl); h.style.cssText = `left:${cx - 44}px;top:548px`;
  const l = S.el("div", "fl lbl", cl, label); l.style.cssText = `left:${cx - 88}px;top:648px`;
  S.figEvents(name, t0, t0 + 2);
  ev(t0, "fig", PATAS.findIndex((p) => p[0] === name));
  return { h, l, t0, f: S.fig(h, name, "mayor") };
});
const END = [447, 949, 1397, 2181, 2382];
END.forEach((_, i) => ev(W0 + i * WS, "letter", i));
ev(T_LAND, "land"); ev(T_URL, "url"); ev(T_LINE, "sign2");
const wcr = cl.querySelector(".wcr"), wdot = cl.querySelector(".wdot");

window.EVENTS = S.EVENTS.sort((a, b) => a.t - b.t);

// ═════ todo es función de t
window.renderAt = (t) => {
  const tq12 = q12(t);
  // la caja se dibuja a saltos y se borra al final
  const dr = clamp(tq12 / T_BOX), er = clamp((tq12 - (T_ERASE + .15)) / .5);
  dBd(t < T_ERASE + .15 ? dr : 1 - er);
  vis(bd, t < ERASE_END);

  // gancho
  show(q, t < T_Q_END, "flex");
  if (t < T_Q_END) qw.forEach((w, i) => vis(w, t >= wordAt("n1", i) - .02));

  // fondo: papel; negro mientras vuelan las palomas
  const dark = t >= T_DOVES && t < T_VANISH + .5;
  $("bx").classList.toggle("dk", dark);
  show($("bx"), t < ERASE_END);
  const so = t < T_VANISH ? 1 : t < T_FILL ? [.6, .25, 0][Math.min(2, stepN(t, T_VANISH, 6))] : 0;

  // láminas, plumilla, palomas
  plA(t); plB(t);
  penClip(t); dovesPlay(t); dovesFreeze(t);
  srcEl.style.opacity = so;
  $("plate").style.display = t >= T_CARD && t < T_DOVES ? "block" : "none";

  // cartela de 1775
  show(card, t >= T_CARD && t < T_PEN);
  if (t >= T_CARD && t < T_PEN) {
    yr.forEach((s, i) => vis(s, t >= YR_AT[i] - .02));
    vis(rd, t >= YR_AT[3] + .2);
  }

  // «Socorre enseñando», escrito con la plumilla (pasos de 1/12 s)
  const onW = t >= T_WRITE && t < T_DOVES;
  show(lemaBig, onW);
  let nibOn = false;
  if (onW) {
    wr.forEach(([el], i) => {
      const [a, b] = WRITE_SPAN[i];
      const p = t < a ? 0 : clamp(Math.floor((t - a) * 12 + 1e-6) / Math.max(1, Math.round((b - a) * 12)));
      el.style.clipPath = `inset(-20% ${((1 - p) * 100).toFixed(1)}% -20% 0)`;
      if (t >= a && t < b + .25) {
        const r = el.getBoundingClientRect();
        nibOn = true;
        nib.style.left = (r.left + r.width * p - 2).toFixed(1) + "px";
        nib.style.top = (r.top + r.height * .82 - 73 + (Math.floor(t * 12) % 2 ? 1 : 0)).toFixed(1) + "px";
      }
    });
  }
  show(nib, nibOn);

  // pie y lema
  const pie = $("pie");
  let ps = "";
  if (t >= T_MAD && t < T_PEN) ps = "Madrid · 1775";
  else if (t >= T_WRITE && t < T_DOVES) ps = "Lema · 1775";
  else if (t >= T_DOVES + .1 && t < T_FILL) ps = "Palomas en vuelo · 1895";
  show(pie, !!ps);
  if (ps && pie.textContent !== ps) pie.textContent = ps;
  show($("lema"), t >= T_LIVE - .1 && t < T_ERASE);

  // calco (trazo a 12 fps, con la pluma) y figura viva
  const trace = clamp((Math.floor((t - T_TRACE) * 12 + 1e-6) / 12) / TRACE_D);
  const onC = t >= T_TRACE && t < T_FILL;
  vis($("calco"), onC);
  if (onC) {
    dCp(trace); dCh(trace);
    const pt = cp.getPointAtLength(CLEN * trace);
    pen.setAttribute("x", (pt.x - PW / 2).toFixed(2)); pen.setAttribute("y", (pt.y - PW / 2).toFixed(2));
    vis(pen, trace < 1);
  }
  const onF = t >= T_FILL && t < T_ERASE + .5;
  vis(fg, onF);
  if (onF) {
    const m = t < T_MOVE ? 0 : Math.min(4, stepN(t, T_MOVE, 12) + 1) / 4, e = S.eIO(m);
    place({ cx: CAL.cx + (FINAL.cx - CAL.cx) * e, cy: CAL.cy + (FINAL.cy - CAL.cy) * e, s: CAL.s + (FINAL.s - CAL.s) * e, r: CAL.r + (FINAL.r - CAL.r) * e });
    figAt(t, T_LIVE);
    let o = 1;
    if (t >= T_ERASE) o = [.6, .25, 0][Math.min(2, stepN(t, T_ERASE, 6))];
    fg.style.opacity = o;
  }

  subs.forEach((f) => f(t));

  // cierre
  const n = t < W0 ? 0 : Math.min(5, Math.floor((t - W0) / WS + 1e-6) + 1);
  wcr.setAttribute("width", n ? END[n - 1] - 22 + 6 : 0);
  vis(WORD, t >= W0); vis(wdot, t >= T_LAND);
  vis(URL_, t >= T_URL); vis(RULE, t >= T_FIGS); vis(LINE, t >= T_LINE);
  figs.forEach((g) => { vis(g.h, t >= g.t0); vis(g.l, t >= g.t0); g.f(t, g.t0); });
};
window.renderAt(0);
})();
</script>
