<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>sesmi · reel</title>
<!--
  Reel vertical de sesmi (1080×1920), en clave de concepto: el cuadrado rojo (el punto de la i)
  vive en una ciudad media, se va, aprende cómo se hace y vuelve. Lo pinta render.mjs fotograma a
  fotograma: inyecta window.BRAND (src/brand/brand.json) y window.TL (timeline.json) y llama a
  renderAt(t). Todo es función de t (sin transiciones CSS), así cada fotograma es determinista.
-->
<style>
@font-face{font-family:"Apfel";src:url("../../public/fonts/ApfelGrotezk-Mittel.woff2") format("woff2");font-weight:500}
@font-face{font-family:"Apfel Fett";src:url("../../public/fonts/ApfelGrotezk-Fett.woff2") format("woff2");font-weight:700}
@font-face{font-family:"Instrument Sans";src:url("../../public/fonts/InstrumentSans-Variable.woff2") format("woff2");font-weight:400 700;font-style:normal}
@font-face{font-family:"Instrument Sans";src:url("../../public/fonts/InstrumentSans-Italic-Variable.woff2") format("woff2");font-weight:400 700;font-style:italic}
:root{
  --paper:#F7F3EE;--paper-2:#EFE9E1;--paper-3:#E6DED3;--ink:#1C1814;--red:#7A1F10;
  --ink-2:color-mix(in srgb,var(--ink) 70%,var(--paper));--ink-3:color-mix(in srgb,var(--ink) 48%,var(--paper));
  --display:"Apfel",sans-serif;--strong:"Apfel Fett",sans-serif;--text:"Instrument Sans",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper)}
#stage{position:relative;width:540px;height:960px;overflow:hidden;background:var(--paper);color:var(--ink);
  font:400 18px/1.5 var(--text);-webkit-font-smoothing:antialiased}
.abs{position:absolute}
.lbl{font:500 11px/1.3 var(--display);letter-spacing:.08em;text-transform:uppercase}
.wmk{display:block}.wmk svg{display:block;width:100%;height:auto;overflow:visible}
.fig svg{display:block;width:100%;height:100%}

#world{position:absolute;left:0;top:0;width:1700px;height:960px;will-change:transform}
#world svg{position:absolute;inset:0;width:1700px;height:960px;overflow:visible}
.tl{position:absolute;left:44px;right:44px;top:586px;text-align:center;text-wrap:balance;font:500 35px/1.1 var(--display);letter-spacing:-.022em;opacity:0}
.tl .w{display:inline-block}
.tl .red{color:var(--red)}
.flb{position:absolute;left:0;right:0;top:546px;display:flex;justify-content:center;align-items:center;gap:10px;color:var(--ink-3);opacity:0}
.flb i{width:8px;height:8px;background:var(--red)}
.fh{position:absolute;left:150px;top:250px;width:240px;height:240px;opacity:0}
#sq{position:absolute;width:14px;height:14px;background:var(--red)}

#endL{position:absolute;inset:0;background:var(--paper);display:none}
#ink{position:absolute;inset:0;background:var(--ink);color:var(--paper);display:none}
#ink .pat{position:absolute;inset:0;display:grid;grid-template-columns:repeat(9,60px);grid-auto-rows:60px}
#ink .pat span{display:flex;align-items:center;justify-content:center;color:color-mix(in srgb,var(--paper) 11%,transparent)}
#ink .pat .fig{width:38px;height:38px}
.ht{font:700 112px/.9 var(--strong);letter-spacing:-.045em;text-align:center}
.ht .dot{display:inline-block;width:.17em;height:.17em;background:var(--paper);margin-left:.04em}

#grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.09}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 70% at 50% 45%,transparent 55%,rgba(28,24,20,.07))}
</style>
</head>
<body>
<div id="stage">
  <div id="world"><svg id="wsvg" viewBox="0 0 1700 960"></svg></div>
  <div id="figs"></div>
  <div id="texts"></div>
  <div id="sq"></div>

  <div id="endL">
    <div class="abs" style="left:90px;top:380px;width:360px"><span class="wmk" id="wmEnd"></span></div>
    <div class="abs lbl" style="left:0;right:0;top:528px;text-align:center;color:var(--ink-2);font-size:12px;opacity:0" id="e1">Sociedad Económica de San Miguel</div>
    <div class="abs" style="left:0;right:0;top:600px;text-align:center;font:500 27px/1 var(--display);opacity:0" id="e2">sesmi.org</div>
    <div class="abs lbl" style="left:0;right:0;top:642px;text-align:center;color:var(--ink-3);opacity:0" id="e3">Talavera de la Reina</div>
  </div>

  <div id="ink">
    <div class="pat" id="pat"></div>
    <div class="abs lbl" style="left:0;right:0;top:268px;text-align:center;color:color-mix(in srgb,var(--paper) 55%,var(--ink));font-size:12px" id="k0">Principio fundacional</div>
    <div class="abs ht" style="left:0;right:0;top:310px"><div id="k1">debemos</div><div id="k2">saber<span class="dot"></span></div></div>
    <div class="abs" style="left:60px;right:60px;top:570px;text-align:center;font:400 20px/1.45 var(--text);color:color-mix(in srgb,var(--paper) 74%,var(--ink))" id="k3">Investigación económica independiente, en&nbsp;abierto, para las ciudades medias.</div>
  </div>

  <svg id="grain" viewBox="0 0 540 960" preserveAspectRatio="none">
    <filter id="gf"><feTurbulence id="turb" type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="1"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="540" height="960" filter="url(#gf)"/>
  </svg>
  <div id="vig"></div>
</div>

<script>
(() => {
const B = window.BRAND;
const NS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);
const EV = [];
const ev = (t, k, v) => EV.push({ t: Math.round(t * 1000) / 1000, k, v });
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
const eIO = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const stepN = (t, t0, fps) => Math.floor((t - t0) * fps + 1e-6);

// ── figuras (copia de SEQ en src/brand/index.ts)
const SEQ = {
  buho: { fps: 5, origin: [50, 85], frames: (v) => B.frames.buho[v],
    steps: [["s1", 0, 0], ["s2", .5, 0], ["blink1", .8, 0], ["blink2", .8, 0], ["s3", .5, 0], ["s4", 0, 0], ["s1", -.5, 0], ["s2", -.8, 0], ["s3", -.5, 0], ["s4", 0, 0]] },
  caballo: { fps: 6, origin: [50, 50], frames: () => B.frames.caballo.run,
    steps: [["g1", 0, -.5], ["g2", .5, 0], ["g3", -.5, -1.5], ["g4", -1.5, -.5], ["g5", 1, 0], ["g6", .5, -.25]] },
  paloma: { fps: 6, origin: [50, 50], frames: () => B.frames.paloma.flap,
    steps: [["f1", 0, 1], ["f2", 0, -.5], ["f3", 0, -1.5], ["f4", 0, -2], ["f5", 0, -1.5], ["f6", 0, -.5]] },
};
const NAMES = ["buho", "caballo", "paloma"];
function fig(host, name, variant = "mayor") {
  host.innerHTML = `<svg viewBox="0 0 100 100"><g><path fill="currentColor"/></g></svg>`;
  const g = host.querySelector("g"), p = host.querySelector("path");
  const Q = SEQ[name], F = Q.frames(variant), rest = B.figs[name][variant];
  return (t, t0) => {
    if (t0 == null || t < t0) { p.setAttribute("d", rest); g.removeAttribute("transform"); return; }
    const [f, r, y] = Q.steps[stepN(t, t0, Q.fps) % Q.steps.length];
    p.setAttribute("d", F[f]);
    g.setAttribute("transform", `translate(0 ${y}) rotate(${r} ${Q.origin[0]} ${Q.origin[1]})`);
  };
}

// ── la ciudad, dibujada a mano (coordenadas del mundo; suelo en y = G)
const G = 470, HOME = 270, S = 1.3; // el mundo se dibuja a escala S alrededor del cuadrado
// temblor de mano: ondas largas y suaves, no dientes de sierra
const wob = (x, y) => [x + Math.sin(y * .11 + x * .03) * .55, y + Math.sin(x * .09 + 1.3) * .6 + Math.sin(x * .23 + y * .05) * .3];
function hand(pts) {
  let d = "";
  for (let i = 0; i < pts.length; i++) {
    const [x0, y0] = pts[i];
    if (i === 0) { const [a, b] = wob(x0, y0); d += `M${a.toFixed(2)} ${b.toFixed(2)}`; continue; }
    const [px, py] = pts[i - 1], n = Math.max(1, Math.ceil(Math.hypot(x0 - px, y0 - py) / 5));
    for (let k = 1; k <= n; k++) { const [a, b] = wob(px + (x0 - px) * k / n, py + (y0 - py) * k / n); d += `L${a.toFixed(2)} ${b.toFixed(2)}`; }
  }
  return d;
}
const P = [];
const L = (x, dy) => P.push([x, G - dy]);
L(-10, 0); L(160, 0);
// casas bajas
L(160, 26); L(171, 38); L(182, 26); L(182, 32); L(194, 44); L(206, 32); L(206, 28); L(214, 28);
// torre (la Colegiata)
L(214, 118); L(218, 118); L(218, 130); L(229, 150); L(240, 130); L(240, 118); L(244, 118); L(244, 60);
// manzanas
L(262, 60); L(262, 78); L(300, 78); L(300, 66); L(326, 66); L(326, 52); L(334, 52); L(334, 62); L(340, 62);
// cúpula (la basílica del Prado)
const DC = 362, DR = 22, DY = 62;
for (let a = Math.PI; a > Math.PI / 2 + .14; a -= .12) P.push([DC + DR * Math.cos(a), G - DY - DR * Math.sin(a)]);
L(358, DY + DR - .5); L(358, DY + DR + 9); L(362, DY + DR + 16); L(366, DY + DR + 9); L(366, DY + DR - .5);
for (let a = Math.PI / 2 - .14; a >= 0; a -= .12) P.push([DC + DR * Math.cos(a), G - DY - DR * Math.sin(a)]);
L(384, 62); L(392, 62);
// bloque de viviendas
L(392, 118); L(440, 118); L(440, 50);
// fábrica de dientes de sierra y chimenea
L(446, 50); L(456, 64); L(456, 50); L(466, 64); L(466, 50); L(476, 64); L(476, 50); L(480, 50); L(480, 172); L(488, 172); L(488, 50); L(494, 50);
L(494, 30); L(502, 38); L(510, 30); L(522, 30); L(522, 0); L(560, 0);
const SKY = hand(P);
// puente viejo sobre el río: arcos colgando del tablero
let BR = "";
for (let i = 0; i < 5; i++) {
  const x0 = 24 + i * 27, x1 = x0 + 27, cx = (x0 + x1) / 2, r = 11.5, pts = [[x0, G + 34]];
  for (let a = Math.PI; a >= 0; a -= .2) pts.push([cx + r * Math.cos(a), G + 34 - 22 * Math.sin(a) + 0]);
  pts.push([x1, G + 34]);
  BR += hand(pts);
}
let WAT = "";
for (let r = 0; r < 4; r++) for (let x = 6 + (r % 2) * 14; x < 170 - r * 12; x += 30) WAT += hand([[x, G + 44 + r * 7], [x + 14, G + 44 + r * 7]]);
let DET = "";
const box = (x, y, w, h) => { DET += hand([[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y]]); };
box(225, G - 108, 7, 12);
for (let c = 0; c < 3; c++) for (let r = 0; r < 4; r++) box(400 + c * 14, G - 106 + r * 20, 5, 7);
box(272, G - 66, 6, 8); box(286, G - 66, 6, 8); box(306, G - 56, 6, 8);
const ROAD = [[640, "Madrid"], [790, "Consultoría"], [940, "Barcelona"], [1090, "Banco central"], [1240, "Datos"]];

const w = $("wsvg");
w.innerHTML = `<g transform="translate(${HOME} ${G}) scale(${S}) translate(${-HOME} ${-G})">` +
  `<path id="ground" d="${hand([[-20, G], [1700, G]])}" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>` +
  `<path id="sky" d="${SKY}" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round" stroke-linecap="round"/>` +
  `<path id="bridge" d="${BR}" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>` +
  `<path id="water" d="${WAT}" fill="none" stroke="currentColor" stroke-opacity=".38" stroke-width="1" stroke-linecap="round"/>` +
  `<path id="det" d="${DET}" fill="none" stroke="currentColor" stroke-opacity=".55" stroke-width=".9"/>` +
  ROAD.map(([x, s], i) => `<g class="road" data-i="${i}"><line x1="${x}" y1="${G}" x2="${x}" y2="${G + 9}" stroke="currentColor" stroke-width="1.4"/>` +
    `<text x="${x}" y="${G + 30}" text-anchor="middle" style="font:500 10px var(--display);letter-spacing:.08em;text-transform:uppercase;fill:var(--ink-3)">${s}</text></g>`).join("") + `</g>`;
const dash = (id) => { const p = $(id), l = p.getTotalLength(); p.style.strokeDasharray = `${l} ${l}`; return (x) => (p.style.strokeDashoffset = l * (1 - clamp(x))); };
const dGround = dash("ground"), dSky = dash("sky"), dBridge = dash("bridge"), dWater = dash("water");

// ── textos (entran con un fundido suave; salen igual)
const TEXTS = [
  [1.0, 4.7, "Hay ciudades que nadie analiza."],
  [7.2, 10.1, "Donde las grandes firmas no vienen."],
  [10.3, 12.9, "Y cuando vienen, no son de aquí."],
  [13.4, 16.5, "Alguien se fue de una de ellas."],
  [17.0, 20.3, "Aprendió cómo se hace."],
  [21.5, 25.8, "Y quiso volver."],
  [26.3, 31.7, "Porque estas ciudades merecen *el *mismo *rigor que Madrid o Barcelona.", true],
  [32.4, 34.7, "Para entenderla."],
  [35.0, 37.3, "Para ponerla en marcha."],
  [37.6, 39.8, "Y para contársela a todos."],
];
const tEls = TEXTS.map(([a, b, s, byWord], i) => {
  const d = document.createElement("div"); d.className = "tl";
  const words = s.split(" ").map((x) => { const red = x.startsWith("*"); return `<span class="w${red ? " hl" : ""}">${x.replace(/\*/g, "")}</span>`; });
  d.innerHTML = words.join(" ");
  $("texts").appendChild(d);
  ev(a, "line", i);
  return { d, a, b, byWord, ws: [...d.querySelectorAll(".w")] };
});

// ── figuras: tres verbos
const FIGS = [["buho", "Investigación", 32.2, 34.8], ["caballo", "Servicios", 34.8, 37.4], ["paloma", "Divulgación", 37.4, 40.0]];
const fEls = FIGS.map(([n, lbl, a, b], i) => {
  const h = document.createElement("div"); h.className = "fh"; $("figs").appendChild(h);
  const l = document.createElement("div"); l.className = "flb lbl"; l.innerHTML = `<i></i>${lbl}`; $("figs").appendChild(l);
  const Q = SEQ[n];
  for (let k = 0, t = a + .3; t < b; k++, t = a + .3 + k / Q.fps) {
    const f = Q.steps[k % Q.steps.length][0];
    if (n === "caballo" && ["g1", "g2", "g4"].includes(f)) ev(t, "hoof", f === "g4" ? 1 : 0);
    if (n === "buho" && f === "blink1") ev(t, "owl");
    if (n === "paloma" && f === "f2") ev(t, "wing");
  }
  ev(a, "fig", i);
  return { h, l, a, b, play: fig(h, n) };
});

// ── el cuadrado: parpadea, se va andando, vuelve
const OUT0 = 13.8, OUT1 = 20.5, OUTF = 6, OUTD = 24;   // ida: 6 pasos/s de 24 px
const BACK0 = 21.2, BACKF = 10, BACKD = 30;            // vuelta: 10 pasos/s de 30 px (tiene prisa)
const FAR = HOME + OUTD * Math.round((OUT1 - OUT0) * OUTF);
const BACK1 = BACK0 + Math.ceil((FAR - HOME) / BACKD) / BACKF;
function squareX(t) {
  if (t < OUT0) return [HOME, 0, HOME];
  if (t < OUT1) { const k = stepN(t, OUT0, OUTF); return [HOME + OUTD * k, k % 2 ? -4 : 0, HOME + OUTD * OUTF * (t - OUT0)]; }
  if (t < BACK0) return [FAR, 0, FAR];
  const k = stepN(t, BACK0, BACKF), x = Math.max(HOME, FAR - BACKD * k);
  return [x, x > HOME && k % 2 ? -4 : 0, Math.max(HOME, FAR - BACKD * BACKF * (t - BACK0))];
}
for (let k = 1; k <= Math.round((OUT1 - OUT0) * OUTF); k++) ev(OUT0 + k / OUTF, "step", k);
for (let k = 1; k <= Math.ceil((FAR - HOME) / BACKD); k++) ev(BACK0 + k / BACKF, "stepB", k);
ev(BACK1, "home");
[0, 1, 2].forEach((i) => ev(i, "blink", i));
[20.8, 21.0].forEach((t, i) => ev(t, "look", i));
ROAD.forEach(([x], i) => {
  // cuando el letrero pasa por debajo del cuadrado, a la ida
  const t = OUT0 + (x - HOME) / (OUTD * OUTF); ev(t, "sign", i);
});
ev(5.0, "draw0"); ev(8.6, "draw1");

// ── «debemos saber.»
const pat = $("pat"), pfs = [];
for (let r = 0; r < 16; r++) for (let c = 0; c < 9; c++) {
  const s = document.createElement("span"), d = document.createElement("div"); d.className = "fig"; s.appendChild(d); pat.appendChild(s);
  pfs.push(fig(d, NAMES[(c + r) % 3], "menor"));
}
const INK0 = 40.0, SH0 = 44.3, SHD = .07;
ev(INK0, "flip"); ev(40.55, "saber", 0); ev(40.8, "saber", 1);

// ── firma: la tinta se encoge hasta ser el punto de la i
const [sqx, sqy, sqw] = B.wordmark.sq.map(Number);
const wmHost = $("wmEnd");
wmHost.innerHTML = `<svg viewBox="${B.wordmark.vb}"><defs><clipPath id="wc"><rect id="wcr" x="22" y="-702" height="714" width="0"/></clipPath></defs>` +
  `<path fill="currentColor" d="${B.wordmark.d}" clip-path="url(#wc)"/><rect id="wdot" fill="#7A1F10" x="${sqx}" y="${sqy}" width="${sqw}" height="${sqw}"/></svg>`;
const SC = 360 / 2360, DOT = [90 + (sqx - 22) * SC, 380 + (sqy + 702) * SC, sqw * SC];
const LETTER_END = [447, 949, 1397, 2181, 2382];
const WM0 = 44.95, WMD = .13;
for (let k = 1; k <= 6; k++) ev(SH0 + k * SHD, "shrink", k);
ev(SH0 + 6 * SHD, "land");
LETTER_END.forEach((_, i) => ev(WM0 + i * WMD, "letter", i));
ev(46.0, "sign2"); ev(46.6, "url");

EV.sort((a, b) => a.t - b.t);
window.EVENTS = EV;

// ── pintar
window.renderAt = (t) => {
  $("turb").setAttribute("seed", String(1 + Math.floor(t * 8) % 12)); // el papel «hierve» a 8 pasos/s

  // mundo: suelo, ciudad, carretera
  const [sx, bob, sxs] = squareX(t);
  const cam = Math.max(0, sxs - 330);
  const worldOn = t < 32.2;
  $("world").style.display = worldOn ? "block" : "none";
  $("world").style.transform = `translateX(${-cam * S}px)`;
  $("world").style.opacity = String(1 - eIO((t - 31.6) / .6));
  dGround(eIO((t - 5.0) / 1.0));
  dSky(eIO((t - 5.4) / 3.2));
  dBridge(eIO((t - 6.6) / 1.4));
  dWater(eIO((t - 7.2) / 1.4));
  $("det").style.opacity = String(eOut((t - 8.2) / .9));

  // cuadrado
  const sq = $("sq");
  let vis = t < 2.5 ? stepN(t, 0, 2) % 2 === 0 : true;
  if (t >= 20.7 && t < 20.85) vis = false;
  if (t >= 20.95 && t < 21.05) vis = false;
  sq.style.display = vis && t < 32.2 ? "block" : "none";
  sq.style.opacity = String(1 - eIO((t - 31.6) / .6));
  sq.style.left = HOME + (sx - HOME - cam) * S - 7 + "px";
  sq.style.top = G - 14 + bob + "px";

  // textos
  tEls.forEach(({ d, a, b, byWord, ws }) => {
    if (t < a - .1 || t > b + .1) { d.style.opacity = 0; return; }
    const out = 1 - eIO((t - (b - .6)) / .6);
    if (byWord) {
      d.style.opacity = out; d.style.transform = "none";
      ws.forEach((w, i) => { const x = eOut((t - a - i * .14) / .5); w.style.opacity = x; w.style.transform = `translateY(${(1 - x) * 8}px)`; w.classList.contains("hl") && (w.style.color = t > a + 2.6 ? "var(--red)" : ""); });
    } else {
      const x = eOut((t - a) / .8);
      d.style.opacity = x * out; d.style.transform = `translateY(${(1 - x) * 10}px)`;
    }
  });

  // figuras
  fEls.forEach(({ h, l, a, b, play }) => {
    const on = t >= a && t < b + .05;
    const x = on ? eOut((t - a) / .5) * (1 - eIO((t - (b - .35)) / .35)) : 0;
    h.style.opacity = x; l.style.opacity = x;
    h.style.transform = `translateY(${(1 - eOut((t - a) / .6)) * 10}px)`;
    if (on) play(t, a + .3);
  });

  // tinta: se abre a saltos desde el centro y al final se encoge hasta el punto de la i
  const ink = $("ink");
  const inkOn = t >= INK0 && t < SH0 + 6 * SHD;
  ink.style.display = inkOn ? "block" : "none";
  if (inkOn) {
    let x0, y0, x1, y1;
    if (t < SH0) {
      const k = Math.min(6, stepN(t, INK0, 1 / .07) + 1), r = (k / 6) * 560;
      [x0, y0, x1, y1] = [270 - r, 480 - r, 270 + r, 480 + r];
    } else {
      const k = Math.min(6, stepN(t, SH0, 1 / SHD) + 1), p = eIO(k / 6);
      const [dx, dy, ds] = DOT;
      [x0, y0, x1, y1] = [p * dx, p * dy, 540 + p * (dx + ds - 540), 960 + p * (dy + ds - 960)];
    }
    ink.style.clipPath = `inset(${y0}px ${540 - x1}px ${960 - y1}px ${x0}px)`;
    pfs.forEach((f) => f(t, INK0 + .5));
    $("k0").style.opacity = eOut((t - 40.5) / .6);
    $("k1").style.visibility = t >= 40.55 ? "visible" : "hidden";
    $("k2").style.visibility = t >= 40.8 ? "visible" : "hidden";
    $("k3").style.opacity = eOut((t - 41.7) / .8);
  }

  // firma
  const endOn = t >= SH0;
  $("endL").style.display = endOn ? "block" : "none";
  if (endOn) {
    $("wdot").style.visibility = t >= SH0 + 6 * SHD ? "visible" : "hidden";
    const n = t < WM0 ? 0 : Math.min(5, stepN(t, WM0, 1 / WMD) + 1);
    $("wcr").setAttribute("width", n ? LETTER_END[n - 1] - 22 + 6 : 0);
    [["e1", 46.0], ["e2", 46.6], ["e3", 47.0]].forEach(([id, a]) => {
      const x = eOut((t - a) / .8); $(id).style.opacity = x; $(id).style.transform = `translateY(${(1 - x) * 8}px)`;
    });
  }
};
window.renderAt(0);
})();
</script>
</body>
</html>
