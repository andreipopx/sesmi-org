<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>sesmi · Una sociedad abierta</title>
<!--
  Material real (créditos en assets/*/credits.json; shared/credits.py lee estas rutas):
  ../assets/video/ia-plumilla.mp4  ../assets/video/reloj-bolsillo-waltham.mp4  ../assets/video/maquina-escribir-tipos-macro.mp4
  ../assets/video/pascalina-laton.mp4  ../assets/foto/plaza-mayor-medinaceli-soportales.jpg
  ../assets/archivo/mapa-castilla-nueva-1785.jpg  ../assets/archivo/mapa-toledo-1768.jpg  ../assets/archivo/enc-patata.jpg
  ../assets/archivo/enc-escritura-pluma.jpg  ../assets/archivo/enc-glaces-san-ildefonso.jpg  ../assets/archivo/imprenta-taller-1769.jpg
  ../assets/archivo/estatutos-asturias.jpg  ../assets/video/ia-lacre.mp4
  ../assets/foto/talavera-puente-viejo-02.jpg  ../assets/foto/talavera-tajo-puente-atardecer.jpg
  ../assets/archivo/buho-great-white-owl-1771.jpg  ../assets/archivo/geric-derby-epsom-1821.jpg  ../assets/archivo/aves-1895-structure.jpg
  ../assets/video/ia-estorninos.mp4
-->
<!--
  Versión A · «Una sociedad abierta». En cada ciudad hay preguntas (cuatro vecinos, con su voz);
  las respuestas están debajo y hay que ir a buscarlas; hace dos siglos la gente se juntaba para
  eso; hoy queremos recuperar esa idea. Tiempos de voz en script.json (+ out/vo.json).
-->
<link rel="stylesheet" href="../shared/base.css">
<style>
.ppl{position:absolute;width:9px;height:9px;background:var(--ink);margin:-4.5px 0 0 -4.5px}
.ppl.red{background:var(--red)}
.qlab{position:absolute;font:italic 400 18px/1.28 var(--text);color:var(--ink);width:170px}
.qlab .w{display:inline-block;opacity:0}
.era{position:absolute;left:0;right:0;top:104px;text-align:center;color:var(--ink-3);font-size:12px}
.fl{position:absolute;top:410px;width:150px;text-align:center;color:var(--ink-3)}
.cap{position:absolute;left:30px;width:480px;top:567px;color:var(--ink-3);font-size:10px;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pframe{position:absolute;left:30px;top:130px;width:480px;height:430px;border:1px solid var(--ink);display:none}
.photo img{max-width:none}
.fl i{display:inline-block;width:7px;height:7px;background:var(--red);margin-right:8px;vertical-align:1px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="chroma" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values=".52 0 0 0 0  0 .6 0 0 0  0 0 .6 0 0  4 -2 -2 0 -.3"/></filter></svg>
<div id="stage">
  <div class="layer" id="world" style="transform:scale(1.25);transform-origin:270px 470px">
    <div class="layer" id="cityL"><svg id="csv" viewBox="0 0 540 960"></svg></div>
    <div class="layer" id="under"><svg id="usv" viewBox="0 0 540 960"></svg></div>
    <div class="layer" id="tableL"><svg id="tsv" viewBox="0 0 540 960"></svg></div>
    <div class="layer" id="lead"><svg id="lsv" viewBox="0 0 540 960"></svg></div>
    <div class="layer" id="people"></div>
    <div class="layer" id="labels"></div>
  </div>
  <div class="layer" id="crowd"></div>
  <div class="layer" id="figs"></div>
  <div class="layer" id="plates"></div>
  <div class="pframe" id="pframe"></div>
  <div class="lbl cap" id="cap"></div>
  <div class="lbl era" id="era"></div>
  <div class="layer" id="subs"></div>
  <div id="vig"></div>
</div>
<script src="../shared/common.js"></script>
<script>
(() => {
const { $, ev, eOut, eIO, clamp, stepN, fade, line, wordAt } = S;
const T = (id) => line(id).t;
const NS = "http://www.w3.org/2000/svg";
const G = 470;

// ── imagen real: todo va a pocos fps (S.photo / S.clip: 6 fps, a saltos) y con cortes secos.
const A = "../assets/archivo/", F = "../assets/foto/";
const FULL = { left: 0, top: 0, width: 540, height: 960 }, PB = { left: 30, top: 130, width: 480, height: 430 };
const Q12 = (t) => Math.floor(t * 12 + 1e-6) / 12;   // lo continuo (trazo, fundidos) se redondea a 12 fps
const qf = (x, n = 6) => Math.round(clamp(x) * n) / n; // fundidos en n escalones
/** Grabado/lámina: blanco y negro cálido, multiplicado sobre el papel. */
const arch = (name, o) => {
  const u = S.photo(A + name + ".jpg", { grade: "grabado", parent: $("plates"), z: 0, box: PB, ...o });
  u.img.style.mixBlendMode = "multiply"; u.box.style.background = "var(--paper-2)";
  return u;
};
/** Foto real o fotograma de vídeo sobre fondo de tinta. */
const real = (o, src) => {
  const u = src.endsWith(".jpg") ? S.photo(src, { parent: $("plates"), z: 0, ...o }) : S.clip(src, { parent: $("plates"), z: 0, ...o });
  u.box.style.background = "var(--ink)";
  return u;
};
const CUTS = []; // cortes secos → un «clac» en audio.py
const cut = (t, v = 0) => { CUTS.push(t); ev(t, "cut", v); };
const shots = []; // planos a pantalla completa o en marco (se pintan en #plates)

// ── 0 · arranque en frío: cuatro planos macro, cortes secos (0–3 s)
const CO = 3.0;
shots.push(S.clip("ia-plumilla", { t0: 0, t1: .8, start: .5, from: [1.02, 50, 50], to: [1.14, 50, 50], grade: "calido", parent: $("plates"), z: 0 }));
shots.push(S.clip("reloj-bolsillo-waltham", { t0: .8, t1: 1.6, start: 1.0, from: [1.25, 40, 50], to: [1.4, 36, 50], grade: "calido", parent: $("plates"), z: 0 }));
shots.push(S.clip("maquina-escribir-tipos-macro", { t0: 1.6, t1: 2.3, start: 2.0, from: [1.1, 50, 50], to: [1.25, 50, 50], grade: "calido", parent: $("plates"), z: 0 }));
shots.push(S.clip("pascalina-laton", { t0: 2.3, t1: CO, start: 2.0, from: [1.3, 30, 50], to: [1.45, 40, 50], grade: "calido", parent: $("plates"), z: 0 }));
[.8, 1.6, 2.3, CO].forEach((t, i) => cut(t, i));

// ── ciudad
const city = S.drawCity($("csv"), { G });
ev(CO + .2, "draw0"); ev(CO + 3.4, "draw1");

// ── la gente: cuadraditos en ventanas y en la calle
const D1 = T("n1") - 1.2;
const HOME = [[228, G - 102], [275, G - 62], [289, G - 62], [309, G - 52], [403, G - 102], [431, G - 62], [130, G - 6], [196, G - 6], [345, G - 6], [505, G - 6]];
const ppl = HOME.map(([x, y], i) => { const d = S.el("div", "ppl", $("people")); return { d, x, y, at: 4.3 + D1 + i * .09 }; });
ppl.forEach((p) => ev(p.at, "pop"));
// quién pregunta (índice en HOME), dónde va su pregunta y desde dónde sale la guía
const ASK = [["q1", 0, 70, 226], ["q2", 5, 300, 196], ["q3", 8, 282, 300], ["q4", 7, 62, 316]];
const qfx = ASK.map(([id, who, lx, ly]) => {
  const L = line(id), lab = S.el("div", "qlab", $("labels"));
  lab.style.left = lx + "px"; lab.style.top = ly + "px"; if (id === "q3") lab.style.width = "150px";
  const ws = L.words.map(([w]) => S.el("span", "w", lab, w));
  ws.forEach((w, i) => i < ws.length - 1 && lab.insertBefore(document.createTextNode(" "), w.nextSibling));
  const ln = document.createElementNS(NS, "path"); $("lsv").appendChild(ln);
  ln.setAttribute("fill", "none"); ln.setAttribute("stroke", "var(--ink-3)"); ln.setAttribute("stroke-width", "1");
  ev(L.t, "ask", who);
  return { L, lab, ws, ln, who, lx, ly };
});

// ── respiro: una plaza vacía, nadie contesta (la música se calla)
const PZ0 = line("q4").end + .25, PZ1 = T("n2");
shots.push(real({ t0: PZ0, t1: PZ1, from: [1.12, 28, 50], to: [1.2, 62, 50], grade: "calido" }, F + "plaza-mayor-medinaceli-soportales.jpg"));
cut(PZ0, 4); cut(PZ1, 5);
const QOUT = PZ0; // las preguntas se quedan flotando hasta el respiro

// ── debajo del suelo: estratos de datos (las respuestas existen)
const U0 = wordAt("n2", 2), DIG = wordAt("n2", 8);
(() => {
  let d = "";
  for (let r = 0; r < 4; r++) for (let x = 6 + r * 9; x < 534; x += 16) d += S.hand([[x, G + 22 + r * 14], [x + 7, G + 22 + r * 14]]);
  const bars = [[60, [10, 16, 13, 22, 19]], [250, [8, 12, 20, 15, 24, 18]], [430, [18, 14, 11, 16, 9]]];
  let b = "";
  bars.forEach(([x0, hs]) => hs.forEach((h, k) => { b += S.box(x0 + k * 9, G + 76 - h, 5, h); }));
  $("usv").innerHTML = `<path id="strata" d="${d}" fill="none" stroke="var(--ink)" stroke-opacity=".32" stroke-width="1"/>` +
    `<path id="bars" d="${b}" fill="none" stroke="var(--ink)" stroke-opacity=".6" stroke-width="1"/>` +
    `<rect id="digger" width="10" height="10" fill="var(--red)"/>`;
})();
const dStrata = S.dash($("strata")), dBars = S.dash($("bars"));
ev(U0, "dig0");
for (let k = 0; k < 6; k++) ev(DIG + k / 6, "dig", k);

// ── siglo XVIII: la gente se junta alrededor de una mesa… y aparece el archivo
const M0 = wordAt("n3", 5), M1 = M0 + 2.6;          // empiezan a andar con «gente»
const SEAT = [[176, 392], [214, 392], [252, 392], [290, 392], [328, 392], [366, 392], [195, 438], [252, 438], [309, 438], [347, 438]];
$("tsv").innerHTML = `<path id="table" d="${S.hand([[150, 412], [392, 412]]) + S.hand([[166, 412], [166, 430]]) + S.hand([[376, 412], [376, 430]])}" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>`;
const dTable = S.dash($("table"));
for (let k = 1; k <= Math.round((M1 - M0) * 6); k += 2) ev(M0 + k / 6, "step", k);
const AN = (n) => !!(window.CLIPS || {})[n];   // los clips anim-* (grabados animados con IA) pueden no estar aún
const plates = []; // lo que lleva marco y pie: { t0, t1, cap, frame, upd }
const plate = (upd, t0, t1, cap = "", frame = true) => plates.push({ t0, t1, cap, frame, upd });
const n3 = (i) => wordAt("n3", i), n4 = (i) => wordAt("n4", i);
// el archivo, palabra a palabra: «mejorar su tierra» (mapas, agricultura) · «escuelas» · «inventos» · «libros»
[
  [arch("mapa-castilla-nueva-1785", { t0: n3(12), t1: n3(14), from: [1.02, 50, 50], to: [1.1, 50, 50] }), n3(12), n3(14), "Mapa de Castilla la Nueva · Tomás López, 1785"],
  [arch("mapa-toledo-1768", { t0: n3(14), t1: n3(14) + 1.4, from: [1.05, 40, 55], to: [1.3, 30, 60] }), n3(14), n3(14) + 1.4, "Mapa de la provincia de Toledo · Tomás López, 1768"],
  [arch("enc-patata", { t0: n3(14) + 1.4, t1: n4(1), from: [1.1, 50, 30], to: [1.25, 50, 45] }), n3(14) + 1.4, n4(1), "Encyclopédie · Agricultura"],
  [arch("enc-escritura-pluma", { t0: n4(1), t1: n4(3), from: [1.1, 50, 2], to: [1.3, 50, 16] }), n4(1), n4(3), "Encyclopédie · Escritura"],
  [arch("enc-glaces-san-ildefonso", { t0: n4(3), t1: n4(5), from: [1.05, 50, 50], to: [1.3, 50, 50] }), n4(3), n4(5), "Encyclopédie · Real Fábrica de Cristales de San Ildefonso"],
  [AN("anim-imprenta") ? real({ t0: n4(5), t1: T("n5"), box: PB, from: [1.0, 50, 50], to: [1.1, 50, 50], grade: "grabado" }, "anim-imprenta")
    : arch("imprenta-taller-1769", { t0: n4(5), t1: T("n5"), from: [1.15, 50, 0], to: [1.4, 50, 9] }), n4(5), T("n5"), "Encyclopédie · Imprenta"],
  [arch("estatutos-asturias", { t0: T("n5"), t1: wordAt("n5", 2), from: [1.0, 50, 40], to: [1.1, 50, 46] }), T("n5"), wordAt("n5", 2), "Estatutos de la Sociedad Económica de Asturias · 1781"],
].forEach(([u, t0, t1, cap], i) => { plate(u, t0, t1, cap); if (i) cut(t0, 6 + i); });
// «Se llamaban sociedades económicas»: el sello baja al lacre (el clip, al revés) y, al decir «económicas», se estampa
const SEAL = wordAt("n5", 3) + .1, SL0 = wordAt("n5", 2);
const LAC = { box: PB, from: [1.0, 50, 50], to: [1.0, 50, 50], grade: "calido", parent: $("plates"), z: 0 };
plate(S.clip("ia-lacre", { ...LAC, t0: SL0, t1: SEAL, start: 2.55, rate: -3 }), SL0, SEAL, "Sello y lacre");
plate(S.clip("ia-lacre", { ...LAC, t0: SEAL, t1: T("n6"), start: 0, rate: 1 }), SEAL, T("n6"), "Sello y lacre");
cut(SL0, 14);
ev(SEAL, "seal");

// ── hoy: Talavera de verdad, que da paso (a saltos) a la ciudad dibujada
const WY0 = T("n6"), WY1 = WY0 + 1.8, WYM = WY0 + .95;
const hoyA = real({ t0: WY0, t1: WYM, box: PB, from: [1.05, 40, 50], to: [1.2, 55, 50], grade: "calido" }, F + "talavera-puente-viejo-02.jpg");
const hoyB = real({ t0: WYM, t1: WY1, box: PB, from: [1.1, 30, 50], to: [1.25, 60, 50], grade: "calido" }, F + "talavera-tajo-puente-atardecer.jpg");
plate(hoyA, WY0, WYM, "Talavera de la Reina"); plate(hoyB, WYM, WY1, "El Tajo");
cut(WY0, 16); cut(WYM, 17);
const BACK0 = WY0 + .7, BACK1 = BACK0 + 1.8;         // la gente vuelve a la ciudad
const SESMI = wordAt("n6", 4);                         // «idea»: aparece el cuadrado rojo
ev(SESMI, "stamp");

// ── las tres figuras: entender, hacer, compartir (cada una, antes, medio segundo de su fuente)
const FA = .6; // duración del plano de fuente
const FIG = [
  ["buho", "Investigación", 30, "n7", () => (AN("anim-buho") ? "anim-buho" : A + "buho-great-white-owl-1771.jpg"), { from: [1.05, 50, 30], to: [1.28, 50, 40] }],
  ["caballo", "Servicios", 195, "n8", () => (AN("anim-derby") ? "anim-derby" : A + "geric-derby-epsom-1821.jpg"), { from: [1.15, 85, 50], to: [1.25, 55, 50] }],
  ["paloma", "Divulgación", 360, "n9", () => (AN("anim-palomas") ? "anim-palomas" : A + "aves-1895-structure.jpg"), { from: [1.0, 30, 50], to: [1.15, 62, 50] }],
];
const FIG_OUT = line("n9").end + .5, FIGIN = T("n7") - FA;
const figs = FIG.map(([n, lbl, x, id, src, mv], i) => {
  const h = S.el("div", "abs", $("figs")); h.style.cssText = `left:${x}px;top:250px;width:150px;height:150px`;
  const l = S.el("div", "fl lbl", $("figs"), `<i></i>${lbl}`); l.style.left = x + "px";
  const t0 = line(id).t; ev(t0, "fig", i); S.figEvents(n, t0 + .2, FIG_OUT);
  const o = { t0: t0 - FA, t1: t0, box: FULL, ...mv }, f = src();
  if (f.startsWith("anim-")) { const u = S.clip(f, { ...o, grade: "grabado", parent: $("plates"), z: 0 }); u.img.style.mixBlendMode = "multiply"; u.box.style.background = "var(--paper-2)"; shots.push(u); }
  else shots.push(f.includes("aves") ? real({ ...o, grade: "grabado" }, f) : arch(f.replace(/^.*\//, "").replace(".jpg", ""), { ...o, grade: i === 1 ? "calido" : "grabado" }));
  cut(t0 - FA, 20 + i); cut(t0, 30 + i);
  return { h, l, t0, play: S.fig(h, n) };
});

// ── sociedad abierta: mucha gente
const C0 = wordAt("n10", 1), C1 = wordAt("n10", 8) + .3;
const crowd = [];
for (let r = 0; r < 12; r++) for (let c = 0; c < 11; c++) {
  const x = 30 + c * 48 + (r % 2) * 24 + Math.sin(r * 7.1 + c * 3.3) * 6, y = 130 + r * 34 + Math.cos(r * 2.9 + c * 5.1) * 5;
  if (x > 520) continue;
  const d = Math.hypot(x - 270, y - 320);
  const e = S.el("div", "ppl", $("crowd")); e.style.left = x + "px"; e.style.top = y + "px";
  if ((r * 11 + c) % 29 === 7) e.classList.add("red");
  crowd.push([e, C0 + (d / 330) * (C1 - C0)]);
}
for (let k = 0; k < 10; k++) ev(C0 + k * (C1 - C0) / 10, "pop");

// ── la bandada: una sociedad abierta se mueve junta (estorninos al amanecer sobre un pueblo)
const MU0 = wordAt("n10", 7), MU1 = T("n11") - .5;
plate(S.clip("ia-estorninos", { t0: MU0, t1: MU1, start: 1.4, from: [1.0, 50, 50], to: [1.12, 50, 50], grade: "calido", box: PB, parent: $("plates"), z: 0 }), MU0, MU1, "");
cut(MU0, 40);

// ── subtítulos de la narradora
const outAt = { n6: FIGIN, n7: line("n8").t - FA, n8: line("n9").t - FA, n9: T("n10") - .05 };
const subs = ["n1", "n2", "n3", "n4", "n5", "n6", "n7", "n8", "n9", "n10"].map((id) =>
  S.sub(id, { parent: $("subs"), hot: id === "n10" ? [1, 2] : id === "n2" ? [8] : [], ...(outAt[id] ? { out: outAt[id] } : {}) }));

// ── «debemos saber.» y firma
const FLIP = T("n11") - .5, SHRINK = FLIP + 3.0;
const saber = S.saber(FLIP, SHRINK, { a: wordAt("n11", 0), b: wordAt("n11", 1), tag: "Conocimiento en abierto, para cualquiera." });
const firma = S.firma(SHRINK + .42);

window.EVENTS = S.EVENTS.sort((a, b) => a.t - b.t);

window.renderAt = (tr) => {
  const t = Q12(tr); // trazos y fundidos a 12 fps; lo que va por pasos (tr) sigue su propio ritmo
  // ciudad: se dibuja, se apaga para la historia, vuelve hoy, se va (corte) para las figuras
  city.draw(t, CO + .2, 3.2);
  const cityOp = t >= FIGIN ? 0 : t < T("n3") ? 1 : t < BACK0 ? 1 - .82 * qf((t - T("n3")) / 1.2) : .18 + .82 * qf((t - BACK0) / 1.2);
  $("cityL").style.opacity = cityOp;

  // gente
  const toTable = (p, i) => {
    const [sx, sy] = SEAT[i];
    if (t < M0) return [p.x, p.y];
    if (t < BACK0) { const k = clamp(stepN(tr, M0, 6) / ((M1 - M0) * 6)); const e = eIO(k); return [p.x + (sx - p.x) * e, p.y + (sy - p.y) * e]; }
    const k = clamp(stepN(tr, BACK0, 6) / ((BACK1 - BACK0) * 6)), e = eIO(k);
    return [sx + (p.x - sx) * e, sy + (p.y - sy) * e];
  };
  const pplOp = t < FIGIN ? 1 : 0;
  ppl.forEach((p, i) => {
    const [x, y] = toTable(p, i);
    p.d.style.left = x + "px"; p.d.style.top = y + "px";
    p.d.style.display = t >= p.at && pplOp > 0 ? "block" : "none";
    p.d.style.opacity = pplOp;
    const asking = qfx.find((q) => q.who === i && t >= q.L.t && t < QOUT);
    p.d.classList.toggle("red", !!asking);
  });

  // preguntas
  qfx.forEach(({ L, lab, ws, ln, who, lx, ly }) => {
    const on = t >= L.t - .05 && t < QOUT;
    lab.style.display = on ? "block" : "none"; ln.style.display = on ? "block" : "none";
    if (!on) return;
    const op = t > L.end + .3 ? .45 : 1;
    lab.style.opacity = op; ln.style.opacity = op * .8;
    ws.forEach((w, i) => { const x = qf((t - L.t - L.words[i][1] + .04) / .28, 3); w.style.opacity = x; });
    const [px, py] = HOME[who], ax = lx > 270 ? lx + lab.offsetWidth - 14 : lx + 10, ay = ly + lab.offsetHeight + 6;
    const p = clamp((t - L.t) / .5);
    ln.setAttribute("d", `M${ax} ${ay} L${ax + (px - ax) * p} ${ay + (py - 10 - ay) * p}`);
  });

  // debajo del suelo
  const uOp = t < T("n3") ? 1 : 1 - .85 * qf((t - T("n3")) / 1.2);
  $("under").style.opacity = t < FIGIN ? uOp : 0;
  dStrata(qf((t - U0) / 1.4, 12)); dBars(qf((t - U0 - .7) / 1.4, 12));
  const dg = $("digger"), dk = Math.min(6, Math.max(0, stepN(tr, DIG, 6)));
  dg.setAttribute("x", 265); dg.setAttribute("y", G - 10 + dk * 9);
  dg.style.display = t >= DIG - .3 && t < T("n3") + 1 ? "block" : "none";

  // mesa
  $("tableL").style.opacity = t < BACK0 ? 1 : 1 - qf((t - BACK0) / .8, 4);
  dTable(qf((t - M0 - 1) / 1.6, 12));
  const era = $("era");
  if (t >= T("n3") && t < WY0) { era.textContent = "Siglo XVIII"; era.style.opacity = qf(fade(t, T("n3") + .3, WY0, .8, .05), 4); }
  else if (t >= WY0 && t < FIGIN) { era.textContent = "Hoy"; era.style.opacity = qf(fade(t, WY0, FIGIN, .3, .05), 4); }
  else era.style.opacity = 0;

  // el cuadrado rojo de sesmi, hoy, en mitad de la calle
  let sq = $("sesmiSq");
  if (!sq) { sq = S.el("div", "ppl red", $("people")); sq.id = "sesmiSq"; sq.style.cssText += ";width:13px;height:13px;margin:-6.5px 0 0 -6.5px;left:270px;top:" + (G - 7) + "px"; }
  sq.style.display = t >= SESMI && t < FIGIN ? "block" : "none";
  sq.style.opacity = pplOp;

  // imagen real (planos macro, láminas, lacre, flashes de archivo)
  shots.forEach((s) => s(tr));
  plates.forEach((p) => p.upd(tr));
  const ap = plates.find((p) => tr >= p.t0 && tr < p.t1);
  // el Tajo da paso a la ciudad dibujada en cuatro escalones (sin fundido continuo)
  hoyB.box.style.opacity = 1 - qf((t - (WY1 - .6)) / .6, 3);
  $("pframe").style.display = ap && ap.frame ? "block" : "none";
  $("cap").textContent = ap ? ap.cap : "";
  $("cap").style.opacity = ap ? 1 : 0;

  // figuras (entran de golpe, con el corte desde su archivo)
  figs.forEach(({ h, l, t0, play }) => {
    const x = t >= t0 && t < FIG_OUT + .1 ? 1 - qf((t - (FIG_OUT - .4)) / .4, 3) : 0;
    h.style.opacity = x; l.style.opacity = x;
    play(tr, t0 + .2);
  });

  // multitud
  const cOut = 1 - qf((t - (FLIP - .5)) / .5, 3);
  crowd.forEach(([e, at]) => { e.style.display = t >= at && t < MU0 ? "block" : "none"; e.style.opacity = .55 * cOut * qf((t - at) / .3, 2); });

  subs.forEach((f) => f(t));
  saber(tr);
  firma(tr);
};
window.renderAt(0);
})();
</script>
</body>
</html>
