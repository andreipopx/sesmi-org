<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>sesmi · teaser</title>
<!--
  Material real (créditos en assets/*/credits.json; shared/credits.py lee estas rutas):
  ../assets/video/ia-plumilla.mp4  ../assets/video/reloj-bolsillo-waltham.mp4  ../assets/video/maquina-escribir-tipos-macro.mp4
  ../assets/video/calculadora-mecanismo.mp4  ../assets/video/ia-lacre.mp4  ../assets/video/metronome.mp4
  ../assets/video/planetario-eisinga-engranajes.mp4  ../assets/video/imprenta-tipografica-roja.mp4  ../assets/video/buho-cornudo-otono.mp4
  ../assets/video/telar-jacquard-cintas.mp4  ../assets/video/pascalina-laton.mp4  ../assets/video/ia-estorninos.mp4
  ../assets/foto/caballo-bronce-galopando.jpg  ../assets/foto/palomas-cielo-melocoton.jpg
-->
<!--
  Versión «teaser» (17,6 s): al estilo de un vídeo de lanzamiento. 13 planos macro de objetos de oficio
  (escribir, medir, imprimir, sellar, enseñar) con cortes secos al pulso de la música (96 bpm: 1 tiempo = 0,625 s),
  todo a pocos fps (clips a 6 fps, zoom y paneo a saltos). Un plano que se queda (la bandada al amanecer) con
  «Debemos saber.» (voz + texto) y corte a papel: el wordmark se escribe a saltos y el cuadrado rojo cae
  y se queda como punto de la i. Todo es función de t; los eventos 'cut' suenan en audio.py.
-->
<link rel="stylesheet" href="../shared/base.css">
<style>
#stage{background:var(--ink)}
#shots{overflow:hidden}
.photo img{max-width:none}
#shade{position:absolute;inset:0;z-index:6;pointer-events:none;background:radial-gradient(ellipse 80% 62% at 50% 48%,rgba(28,24,20,0) 35%,rgba(28,24,20,.58) 100%)}
#dim{position:absolute;inset:0;z-index:7;background:var(--ink);opacity:0;pointer-events:none}
.saberT{position:absolute;left:0;right:0;top:340px;z-index:12;color:var(--paper);display:none}
.saberT .ht div{visibility:hidden}
.saberT .dot{display:inline-block;width:.17em;height:.17em;background:var(--paper);margin-left:.04em}
#close{position:absolute;inset:0;background:var(--paper);display:none;z-index:19}
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="shots"></div>
  <div id="shade"></div>
  <div id="dim"></div>
  <div class="saberT" id="saberT"><div class="ht"><div id="sA">debemos</div><div id="sB">saber<span class="dot"></span></div></div></div>
  <div id="close"></div>
  <div id="vig"></div>
</div>
<script src="../shared/common.js"></script>
<script>
(() => {
const { $, ev, clamp, stepN, wordAt, line } = S;
const BEAT = 60 / 96, FPS = 6;                 // pulso de la música y fps del movimiento (divide a 60)
const has = (slug) => !!(window.CLIPS || {})[slug];

// ── planos. n = tiempos de la música (1 tiempo = 0,625 s). aspecto = ancho/alto de la imagen.
// from/to = [zoom, x, y]: x e y = punto de la imagen (0–1) que queda en el centro del encuadre; zoom 1 = «cubrir».
// start = segundo del clip donde empieza. Todo a saltos de 1/6 s.
const AR = "../assets/archivo/", FO = "../assets/foto/";
const clip = (slug, ar, from, to, n, start = 0, grade = "calido") => ({ clip: slug, ar, from, to, n, start, grade });
const photo = (src, ar, from, to, n, grade = "calido") => ({ src, ar, from, to, n, grade });
const SHOTS = [
  clip("ia-plumilla", 720 / 1280, [1.55, .57, .52], [1.9, .56, .56], 2, .4, "natural"),            // escribir: la punta de la pluma
  clip("reloj-bolsillo-waltham", 1920 / 1080, [1.7, .55, .47], [2.0, .56, .50], 1, 1.2),           // medir: el reloj
  clip("maquina-escribir-tipos-macro", 1920 / 1080, [1.9, .50, .70], [2.2, .50, .72], 1, 2.0),     // escribir: las barras de tipos
  clip("calculadora-mecanismo", 1920 / 1080, [1.9, .58, .52], [2.2, .58, .50], 1, 3.6),            // calcular: peines y ruedas
  clip("ia-lacre", 720 / 1280, [1.2, .45, .55], [1.45, .45, .62], 2, .5, "natural"),              // sellar: el sello y el lacre
  clip("metronome", 1920 / 1080, [2.3, .48, .40], [2.5, .48, .42], 1, .3),                         // medir el tiempo
  clip("planetario-eisinga-engranajes", 1920 / 1080, [1.5, .55, .55], [1.7, .55, .55], 1, .5),    // medir: engranajes
  clip("imprenta-tipografica-roja", 854 / 480, [1.1, .20, .60], [1.25, .18, .62], 1, 0),            // imprimir: la prensa y la tinta roja
  has("anim-buho") ? clip("anim-buho", 720 / 1280, [1.15, .5, .5], [1.3, .5, .48], 2, 0, "natural")
    : clip("buho-cornudo-otono", 1920 / 1080, [2.2, .56, .42], [2.4, .56, .44], 2, 1.5),          // el búho (Investigación)
  clip("telar-jacquard-cintas", 1920 / 1080, [1.5, .52, .62], [1.7, .52, .62], 1, 4.6),            // tejer: las cintas
  has("anim-derby") ? clip("anim-derby", 720 / 1280, [1.1, .5, .5], [1.25, .5, .5], 1, 0, "natural")
    : photo(FO + "caballo-bronce-galopando.jpg", 1920 / 1280, [1.8, .56, .40], [2.1, .56, .40], 1),  // el caballo (Servicios)
  clip("pascalina-laton", 1920 / 1080, [2.2, .40, .55], [2.5, .40, .55], 1, 3.4),                  // calcular: ruedas de latón
  has("anim-palomas") ? clip("anim-palomas", 720 / 1280, [1.1, .5, .5], [1.25, .5, .5], 2, 0, "natural")
    : photo(FO + "palomas-cielo-melocoton.jpg", 1280 / 1706, [1.2, .5, .62], [1.5, .5, .45], 2),     // la paloma (Divulgación)
];
const HOLD = clip("ia-estorninos", 720 / 1280, [1.0, .5, .62], [1.3, .52, .56], 0, 1.0, "natural");  // el plano que se queda

let tc = 0;
SHOTS.forEach((s, i) => { s.t0 = tc; tc += s.n * BEAT; s.t1 = tc; ev(s.t0, "cut", i); });
HOLD.t0 = tc;
const VT = line("n1").t;                       // la voz entra sobre el plano que se queda
const CLOSE = VT + line("n1").dur + .95;       // corte a papel
HOLD.t1 = CLOSE;
ev(HOLD.t0, "cut", SHOTS.length);
ev(CLOSE, "cut", SHOTS.length + 1);

// ── plano: S.clip / S.photo (fotogramas a 6 fps) + encuadre propio: zoom y paneo en pasos de 1/6 s
const mk = (s) => {
  const o = { t0: s.t0, t1: s.t1, grade: s.grade, fps: FPS, parent: $("shots"), z: 2 };
  const base = s.clip ? S.clip(s.clip, { ...o, start: s.start }) : S.photo(s.src, o);
  const img = base.img;
  return (t) => {
    base(t);
    if (t < s.t0 || t >= s.t1) return;
    const tq = s.t0 + stepN(t, s.t0, FPS) / FPS;
    const p = clamp((tq - s.t0) / Math.max(.001, s.t1 - s.t0));
    const [z, fx, fy] = s.from.map((v, i) => v + (s.to[i] - v) * p);
    const k = Math.max(540 / s.ar, 960) * z;   // alto en px de la imagen (zoom 1 = cubrir el encuadre)
    const H = k, W = k * s.ar;
    const L = clamp(270 - fx * W, 540 - W, 0), T = clamp(480 - fy * H, 960 - H, 0);
    const st = img.style;
    st.objectFit = "fill"; st.inset = "auto"; st.transform = "none";
    st.width = W.toFixed(1) + "px"; st.height = H.toFixed(1) + "px"; st.left = L.toFixed(1) + "px"; st.top = T.toFixed(1) + "px";
  };
};
const shots = SHOTS.map(mk);
const hold = mk(HOLD);

// ── «debemos saber.» sobre el plano que se queda: aparece palabra a palabra, a saltos
const W1 = wordAt("n1", 0), W2 = wordAt("n1", 1);

// ── cierre: papel, wordmark escrito a saltos; el cuadrado rojo cae a saltos y es el punto de la i
const B = window.BRAND, [sqx, sqy, sqw] = B.wordmark.sq.map(Number);
const cl = $("close");
const WORD = S.el("div", "abs", cl);
WORD.style.cssText = "left:90px;top:380px;width:360px";
WORD.innerHTML = `<svg viewBox="${B.wordmark.vb}" style="display:block;width:100%;overflow:visible"><defs><clipPath id="wc"><rect class="wcr" x="22" y="-702" height="714" width="0"/></clipPath></defs>` +
  `<path fill="currentColor" d="${B.wordmark.d}" clip-path="url(#wc)"/><rect class="wdot" fill="#7A1F10" x="${sqx}" y="${sqy}" width="${sqw}" height="${sqw}"/></svg>`;
const tag = S.el("div", "abs lbl", cl, "Una sociedad abierta"); tag.style.cssText = "left:0;right:0;top:530px;text-align:center;color:var(--ink-2);font-size:12px";
const url = S.el("div", "abs", cl, "sesmi.org"); url.style.cssText = "left:0;right:0;top:572px;text-align:center;font:500 27px/1 var(--display)";
const END = [447, 949, 1397, 2181, 2382];
const SC = 360 / 2360, FALL = (380 + (sqy + 702) * SC + 30) / SC;    // unidades del wordmark hasta salir por arriba
const W0 = CLOSE + 1 / 6, DROP = W0 + 5 / FPS + 1 / 6, FALLSTEPS = 5, LAND = DROP + FALLSTEPS / 10;
END.forEach((_, i) => ev(W0 + i / FPS, "letter", i));
ev(LAND, "land");
const TAG = LAND + .4, URL = LAND + .8;
ev(TAG, "sign2"); ev(URL, "url");
const dotEl = cl.querySelector(".wdot"), wcr = cl.querySelector(".wcr");
const DUR = LAND + 2.8;                         // último plano limpio ~2 s
window.TEASER_DURATION = DUR;

window.EVENTS = S.EVENTS.sort((a, b) => a.t - b.t);

window.renderAt = (t) => {
  shots.forEach((f) => f(t));
  hold(t);
  // el plano que se queda: se oscurece en tres pasos y «debemos saber.» aparece con la voz
  const dk = t < VT - .3 ? 0 : Math.min(3, stepN(t, VT - .3, FPS) + 1) / 3;
  $("dim").style.opacity = t >= HOLD.t0 && t < CLOSE ? (.18 + .44 * dk).toFixed(2) : 0;
  $("shade").style.display = t < CLOSE ? "block" : "none";
  const ST = $("saberT");
  ST.style.display = t >= W1 - .02 && t < CLOSE ? "block" : "none";
  $("sA").style.visibility = t >= W1 - .02 ? "visible" : "hidden";
  $("sB").style.visibility = t >= W2 - .02 ? "visible" : "hidden";

  // cierre
  cl.style.display = t >= CLOSE ? "block" : "none";
  if (t >= CLOSE) {
    const n = t < W0 ? 0 : Math.min(5, stepN(t, W0, FPS) + 1);
    wcr.setAttribute("width", n ? END[n - 1] - 22 + 6 : 0);
    let dy = -FALL, vis = 0;
    if (t >= DROP) {
      vis = 1;
      const k = Math.min(FALLSTEPS, stepN(t, DROP, 10) + 1), q = k / FALLSTEPS;
      dy = -(1 - q * q) * FALL;
      if (t >= LAND + .1 && t < LAND + .2) dy = -12;     // un rebote mínimo, de un solo paso
    }
    dotEl.setAttribute("transform", `translate(0 ${dy.toFixed(1)})`);
    dotEl.style.opacity = vis;
    tag.style.opacity = t >= TAG ? 1 : 0;
    url.style.opacity = t >= URL ? 1 : 0;
  }
};
window.renderAt(0);
})();
</script>
</body>
</html>
