<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>sesmi · teaser</title>
<!--
  Versión «teaser» (18,2 s): al estilo de un vídeo de lanzamiento. 12 planos macro de objetos de oficio
  (escribir, medir, imprimir, sellar, enseñar), cortes secos al pulso de la música (96 bpm: 1 tiempo = 0,625 s),
  un plano que se queda (el lacre rojo) con «Debemos saber.» (voz + texto) y corte a papel: el cuadrado rojo
  cae y es el punto de la i. Todo es función de t; los eventos 'cut' suenan en audio.py.
-->
<link rel="stylesheet" href="../shared/base.css">
<style>
#stage{background:var(--ink)}
.shot{position:absolute;inset:0;overflow:hidden;display:none;background:var(--ink)}
.shot img{position:absolute;max-width:none;transform-origin:0 0}
.shot img.sh{-webkit-mask-image:radial-gradient(ellipse 90% 46% at 50% 47%,#000 38%,transparent 100%);mask-image:radial-gradient(ellipse 90% 46% at 50% 47%,#000 38%,transparent 100%)}
.shot .shade{position:absolute;inset:0;background:radial-gradient(ellipse 75% 65% at 50% 48%,rgba(28,24,20,.06) 30%,rgba(28,24,20,.62) 100%)}
.shot .dim{position:absolute;inset:0;background:var(--ink);opacity:0}
.saberT{position:absolute;left:0;right:0;top:340px;z-index:12;color:var(--paper);display:none}
.saberT .ht{font:700 112px/.9 var(--strong);letter-spacing:-.045em;text-align:center}
.saberT .ht div{opacity:0}
.saberT .dot{display:inline-block;width:.17em;height:.17em;background:var(--paper);margin-left:.04em}
#close{position:absolute;inset:0;background:var(--paper);display:none;z-index:19}
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="shots"></div>
  <div class="saberT" id="saberT"><div class="ht"><div id="sA">debemos</div><div id="sB">saber<span class="dot"></span></div></div></div>
  <div id="close"></div>
  <div id="vig"></div>
</div>
<script src="../shared/common.js"></script>
<script>
(() => {
const { $, ev, eOut, eIO, clamp, stepN, wordAt, line } = S;
const BEAT = 60 / 96;
const GRADE = S.GRADE.calido;

// ── planos: [archivo, ancho, alto, desde [zoom, x, y], hasta [zoom, x, y], tiempos]
// x, y = punto de la imagen (0–1) que queda en el centro del encuadre; zoom 1 = «cubrir» la pantalla.
const A = "../assets/archivo/";
const SHOTS = [
  ["enc-escritura-pluma", 1228, 2000, [1.7, .5, .165], [2.1, .5, .235], 2],   // escribir: la mano y la plumilla
  ["enc-reloj-c", 1354, 2000, [1.5, .46, .86], [1.95, .52, .80], 2],           // medir: el mecanismo
  ["enc-imprenta-pl1", 1286, 2000, [1.7, .5, .78], [2.0, .56, .78], 1],        // imprimir: los tipos (al revés)
  ["enc-imprenta-taille-douce", 1296, 2000, [1.7, .30, .78], [2.1, .30, .72], 1], // la prensa
  ["matriz-sello-bronce-impronta", 1280, 1839, [1.5, .5, .42], [1.9, .5, .5], 2], // sellar
  ["armilar-wellcome", 1920, 1524, [1.9, .5, .52], [2.3, .5, .47], 2],         // medir: la esfera armilar
  ["enc-reloj-b", 1228, 2000, [1.7, .5, .55], [2.0, .5, .5], 1],               // el torno del relojero
  ["plantin-escudo-drukkersmerk", 1442, 2000, [1.3, .5, .36], [1.65, .52, .42], 1], // el compás de Plantin
  ["atenas-tetradracma-lechuza-a", 1920, 1920, [1.5, .52, .42], [1.9, .56, .42], 2], // la lechuza de Atenas (búho)
  ["geric-derby-epsom-1821", 1920, 1402, [1.9, .30, .62], [1.9, .66, .62], 1], // el caballo
  ["paloma-grabado-coloreado-wellcome", 1920, 1218, [1.5, .30, .40], [1.8, .35, .42], 1], // la paloma
  ["enc-imprenta-pl1", 1286, 2000, [2.0, .5, .13], [2.3, .5, .15], 1],         // enseñar: el taller de la Encyclopédie
].map(([f, w, h, from, to, n]) => ({ src: A + f + ".jpg", w, h, from, to, n }));
const HOLD = { src: A + "lacre-sombrereros-1842.jpg", w: 1280, h: 1222, from: [1.0, .5, .5], to: [1.14, .5, .5] };

let tc = 0;
SHOTS.forEach((s, i) => { s.t0 = tc; tc += s.n * BEAT; s.t1 = tc; ev(s.t0, "cut", i); });
HOLD.t0 = tc; ev(tc, "cut", SHOTS.length);   // el plano que se queda
const VT = line("n1").t;                      // la voz entra sobre el plano que se queda
const CLOSE = 13.7;                           // corte a papel
HOLD.t1 = CLOSE;

// ── imagen con foco (zoom + paneo lento) y profundidad de campo falsa: borde desenfocado, centro nítido
const mk = (s) => {
  const box = S.el("div", "shot", $("shots"));
  const mkimg = (cls) => { const im = S.el("img", cls, box); im.src = s.src; im.style.filter = cls === "bl" ? GRADE + " blur(3.2px)" : GRADE; return im; };
  const bl = mkimg("bl"), sh = mkimg("sh");
  S.el("div", "shade", box);
  const dim = S.el("div", "dim", box);
  const cover = Math.max(540 / s.w, 960 / s.h);
  const upd = (t) => {
    const on = t >= s.t0 && t < s.t1;
    box.style.display = on ? "block" : "none";
    if (!on) return;
    const p = clamp((t - s.t0) / (s.t1 - s.t0));
    const [z, fx, fy] = s.from.map((v, i) => v + (s.to[i] - v) * p);
    const k = cover * z, W = s.w * k, H = s.h * k;
    const L = clamp(270 - fx * W, 540 - W, 0), T = clamp(480 - fy * H, 960 - H, 0);
    [bl, sh].forEach((im) => { im.style.width = W + "px"; im.style.height = H + "px"; im.style.left = L + "px"; im.style.top = T + "px"; });
    return p;
  };
  upd.dim = dim; upd.box = box;
  return upd;
};
const shots = SHOTS.map(mk);
const hold = mk(HOLD);

// ── «debemos saber.» sobre el plano que se queda (la voz lo dice; el texto aparece palabra a palabra)
const W1 = wordAt("n1", 0), W2 = wordAt("n1", 1);

// ── cierre: papel, wordmark, el cuadrado rojo cae y es el punto de la i
const B = window.BRAND, [sqx, sqy, sqw] = B.wordmark.sq.map(Number);
const cl = $("close");
const WORD = cl.appendChild(Object.assign(document.createElement("div"), { className: "abs" }));
WORD.style.cssText = "left:90px;top:380px;width:360px";
WORD.innerHTML = `<svg viewBox="${B.wordmark.vb}" style="display:block;width:100%;overflow:visible"><defs><clipPath id="wc"><rect class="wcr" x="22" y="-702" height="714" width="0"/></clipPath></defs>` +
  `<path fill="currentColor" d="${B.wordmark.d}" clip-path="url(#wc)"/><rect class="wdot" fill="#7A1F10" x="${sqx}" y="${sqy}" width="${sqw}" height="${sqw}"/></svg>`;
const tag = S.el("div", "abs lbl", cl, "Una sociedad abierta"); tag.style.cssText = "left:0;right:0;top:530px;text-align:center;color:var(--ink-2);font-size:12px";
const url = S.el("div", "abs", cl, "sesmi.org"); url.style.cssText = "left:0;right:0;top:572px;text-align:center;font:500 27px/1 var(--display)";
const END = [447, 949, 1397, 2181, 2382];
const SC = 360 / 2360, FALL = 380 * 0 + (380 + (sqy + 702) * SC + 30) / SC; // unidades del wordmark hasta salir por arriba
const W0 = CLOSE + .1, DROP = W0 + 5 * .12 + .1, LAND = DROP + .36;
END.forEach((_, i) => ev(W0 + i * .12, "letter", i));
ev(LAND, "land");
ev(LAND + 1.0, "sign2"); ev(LAND + 1.4, "url");
const dotEl = cl.querySelector(".wdot"), wcr = cl.querySelector(".wcr");

window.EVENTS = S.EVENTS.sort((a, b) => a.t - b.t);

window.renderAt = (t) => {
  shots.forEach((f) => f(t));
  const p = hold(t);
  // el plano que se queda: se oscurece un poco y «debemos saber.» aparece con la voz
  const dimV = .22 + .38 * eOut((t - (VT - .3)) / 1.0);
  hold.dim.style.opacity = t >= HOLD.t0 ? dimV : 0;
  const ST = $("saberT");
  ST.style.display = t >= W1 - .05 && t < CLOSE ? "block" : "none";
  [[$("sA"), W1], [$("sB"), W2]].forEach(([e, w]) => { const x = eOut((t - w + .04) / .3); e.style.opacity = x; e.style.transform = `translateY(${(1 - x) * 8}px)`; });

  // cierre
  cl.style.display = t >= CLOSE ? "block" : "none";
  if (t >= CLOSE) {
    const n = t < W0 ? 0 : Math.min(5, stepN(t, W0, 1 / .12) + 1);
    wcr.setAttribute("width", n ? END[n - 1] - 22 + 6 : 0);
    const q = clamp((t - DROP) / (LAND - DROP));
    let dy = -(1 - q * q) * FALL;
    if (t < DROP) dy = -FALL;
    if (t >= LAND) { const b = t - LAND; dy = b < .12 ? -Math.sin(b / .12 * Math.PI) * 14 : 0; }  // un rebote mínimo
    dotEl.setAttribute("transform", `translate(0 ${dy.toFixed(1)})`);
    dotEl.style.opacity = t < DROP ? 0 : 1;
    [[tag, LAND + 1.0], [url, LAND + 1.4]].forEach(([e, a]) => { const x = eOut((t - a) / .7); e.style.opacity = x; e.style.transform = `translateY(${(1 - x) * 8}px)`; });
  }
};
window.renderAt(0);
})();
</script>
</body>
</html>
