<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>sesmi · Preguntas</title>
<!--
  Versión B · «Preguntas». De noche, cada vecino enciende su ventana con una pregunta (con su voz);
  se acumulan, se encienden todas, silencio, y queda una: «¿Y si nos quedamos?». Amanece mientras
  la narradora responde. Tiempos de voz en script.json (+ out/vo.json).
  Imagen de archivo (assets/archivo): arranque en frío con tres planos nocturnos (etalonaje 'noche'), un destello
  tras cada pregunta (detalle del oficio al que se refiere) y, al amanecer, la vista de 1567 y las palomas ('calido').
-->
<link rel="stylesheet" href="../shared/base.css">
<style>
#stage{background:var(--bgc,var(--ink));color:var(--fgc,var(--paper))}
.qlab{position:absolute;font:italic 400 21px/1.28 var(--text);width:205px;color:var(--paper)}
.qlab .w{display:inline-block;opacity:0}
.last{position:absolute;left:30px;right:30px;top:330px;text-align:center;font:500 44px/1.05 var(--display);letter-spacing:-.025em;color:var(--paper)}
.last .w{display:inline-block;opacity:0}
.ppl{position:absolute;width:9px;height:9px;background:var(--ink);margin:-4.5px 0 0 -4.5px}
.sub{top:700px}
#flash,#dawnph{z-index:0}
#cold{z-index:50}
.shade{position:absolute;inset:0;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="world" style="transform:translateY(150px) scale(1.25);transform-origin:270px 470px">
    <div class="layer"><svg id="csv" viewBox="0 0 540 960"></svg></div>
    <div class="layer"><svg id="wsv" viewBox="0 0 540 960"></svg></div>
    <div class="layer" id="people"></div>
  </div>
  <div class="layer" id="dawnph"></div>
  <div class="layer"><svg id="chart" viewBox="0 0 540 960"></svg></div>
  <div class="layer" id="flash"></div>
  <div class="layer" id="labels"></div>
  <div class="layer" id="cold"></div>
  <div class="last" id="last"></div>
  <div class="layer" id="subs"></div>
  <div id="vig"></div>
</div>
<script src="../shared/common.js"></script>
<script>
(() => {
const { $, ev, eOut, eIO, clamp, stepN, line, wordAt } = S;
const NS = "http://www.w3.org/2000/svg";
const G = 470, OFF = 1.1, CITY0 = 1.7; // OFF: lo que se ha desplazado la voz para dejar sitio al arranque en frío
const NOCHE = S.GRADE.noche + " brightness(.82)", CALIDO = S.GRADE.calido;
const PAPER = [247, 243, 238], INK = [28, 24, 20];
const mix = (a, b, k) => `rgb(${a.map((x, i) => Math.round(x + (b[i] - x) * k)).join(",")})`;

// ── la ciudad de noche (trazo en papel sobre tinta; al amanecer se invierte)
const city = S.drawCity($("csv"), { G, color: "var(--fgc,var(--paper))", windows: false });
ev(CITY0, "draw0"); ev(CITY0 + 2.2, "draw1");
// ventanas: las de la ciudad y unas cuantas más
const WIN = S.city(G, "hoy").windows.concat([
  [226, G - 90, 6, 10], [226, G - 74, 6, 10], [266, G - 50, 6, 8], [280, G - 50, 6, 8], [294, G - 50, 6, 8], [310, G - 40, 6, 8],
  [348, G - 50, 6, 8], [372, G - 50, 6, 8], [450, G - 40, 6, 8], [462, G - 40, 6, 8], [500, G - 22, 5, 7], [512, G - 22, 5, 7],
  [252, G - 40, 6, 8], [232, G - 50, 6, 8], [176, G - 12, 5, 7], [338, G - 40, 6, 8],
]);
const winEls = WIN.map(([x, y, w, h]) => {
  const g = document.createElementNS(NS, "g");
  g.innerHTML = `<path d="${S.box(x, y, w, h)}" fill="none" stroke="currentColor" stroke-opacity=".5" stroke-width="1"/><rect x="${x + .5}" y="${y + .5}" width="${w - 1}" height="${h - 1}" fill="var(--red)" opacity="0"/>`;
  $("wsv").appendChild(g);
  return g.querySelector("rect");
});

// ── preguntas: ventana que se enciende + texto en el cielo
const Q = [["p1", 3, 36, 120], ["p2", 13, 300, 150], ["p3", 0, 36, 205], ["p4", 7, 300, 235], ["p5", 16, 36, 290], ["p6", 21, 300, 320], ["p7", 9, 36, 375], ["p8", 26, 300, 405]];
const qs = Q.map(([id, wi, lx, ly]) => {
  const L = line(id), lab = S.el("div", "qlab", $("labels"));
  lab.style.left = lx + "px"; lab.style.top = ly + "px";
  const ws = L.words.map(([w]) => S.el("span", "w", lab, w));
  ws.forEach((w, i) => i < ws.length - 1 && lab.insertBefore(document.createTextNode(" "), w.nextSibling));
  ev(L.t, "light", wi);
  return { L, lab, ws, wi };
});
// murmullo: se encienden todas, a saltos; luego apagón
const MUR0 = 16.3 + OFF, MUR1 = 18.3 + OFF, BLACK = 18.4 + OFF;
const order = WIN.map((_, i) => i).filter((i) => !Q.some((q) => q[1] === i)).sort((a, b) => ((a * 7919) % 31) - ((b * 7919) % 31));
const litAt = {};
order.forEach((i, k) => { litAt[i] = MUR0 + (k / order.length) * (MUR1 - MUR0); });
for (let k = 0; k < order.length; k += 2) ev(litAt[order[k]], "lightq", k);
ev(BLACK, "black");
// la última: sola
const P9 = line("p9"), LASTWIN = 8;
const last = $("last");
const lws = P9.words.map(([w]) => S.el("span", "w", last, w));
lws.forEach((w, i) => i < lws.length - 1 && last.insertBefore(document.createTextNode(" "), w.nextSibling));
ev(P9.t - .5, "lone");

// ── amanecer: de tinta a papel en 6 saltos
const DAWN = line("n1").t, DAWND = .9;
ev(DAWN, "dawn");
const dawnK = (t) => clamp(stepN(t, DAWN, 6 / DAWND) / 6);

// ── «con datos, en abierto, para cualquiera»
const DAT = wordAt("n2", 1), ABI = wordAt("n2", 3), CUAL = wordAt("n2", 5);
(() => {
  const pts = []; for (let x = 40; x <= 500; x += 20) pts.push([x, 330 - 40 * Math.sin(x / 70) - (x - 40) * .18 + Math.sin(x * 1.7) * 6]);
  let grid = ""; for (let x = 40; x <= 500; x += 46) grid += S.hand([[x, 360], [x, 366]]);
  $("chart").innerHTML = `<path id="cl" d="${S.hand(pts)}" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>` +
    `<path id="cb" d="${S.hand([[40, 366], [500, 366]]) + grid}" fill="none" stroke="var(--ink)" stroke-opacity=".4" stroke-width="1"/>` +
    `<rect id="cm" width="10" height="10" fill="var(--red)"/>`;
  window.__pts = pts;
})();
const dCl = S.dash($("cl")), dCb = S.dash($("cb"));
ev(DAT, "chart"); ev(ABI, "open"); ev(CUAL, "people");
const PPL = [60, 105, 150, 205, 250, 300, 345, 395, 440, 490].map((x, i) => { const d = S.el("div", "ppl", $("people")); return { d, x, at: CUAL + i * .07 }; });

// ── arranque en frío: tres planos de noche, cortes secos (ventana de taller, ventana de tintorería, palomas)
const cold = $("cold"), cold_ = [
  [0.0, 0.6, "reliure-atelier", NOCHE + " contrast(1.2)", [1.45, 6, 50], [1.8, 20, 50], "50% 50%"],
  [0.6, 1.2, "enc-recueil-1772", NOCHE + " contrast(1.25)", [2.4, 50, 50], [3.0, 50, 50], "14% 9%"],
  [1.2, 1.75, "aves-1895-structure", NOCHE, [1.15, 38, 50], [1.4, 40, 50], "45% 45%"],
].map(([t0, t1, f, grade, from, to, org]) => {
  const p = S.photo(`../assets/archivo/${f}.jpg`, { t0, t1, from, to, grade, parent: cold, z: 1 });
  p.img.style.transformOrigin = org;
  return p;
});
S.ev(0.0, "cut", 0); S.ev(0.6, "cut", 1); S.ev(1.2, "cut", 2); S.ev(CITY0 - .05, "cut", 3);

// ── destellos: junto a la pregunta, un detalle real del oficio de que se habla (0,7 s, detrás del texto)
const FLASH_D = .7;
const FL = {
  p1: ["enc-reloj-a", [1.2, 30, 60], [1.0, 40, 60]],            // fábrica (manufactura de lunas)
  p2: ["imprenta-taller-1769", [1.35, 50, 36], [1.15, 50, 40]],  // trabajo de un oficio
  p3: ["enc-patata", [1.5, 50, 44], [1.15, 50, 46]],             // una casa, en corte
  p4: ["lacre-sombrereros-1842", [1.25, 50, 40], [1.0, 50, 42]], // tienda: sello de los sombrereros
  p5: ["matriz-sello-bronce-impronta", [1.3, 50, 35], [1.0, 50, 40]], // el sello del ayuntamiento
  p7: ["mapa-toledo-1768", [1.3, 40, 60], [1.0, 55, 55]],        // adónde se fueron
  p8: ["reliure-atelier", [1.25, 25, 50], [1.0, 60, 50]],        // el taller grande
};
const flashes = qs.filter((q) => FL[q.L.id]).map((q) => {
  const [f, from, to] = FL[q.L.id], [lx, ly] = [parseFloat(q.lab.style.left), parseFloat(q.lab.style.top)];
  const p = S.photo(`../assets/archivo/${f}.jpg`, { t0: q.L.t - .02, t1: q.L.t + FLASH_D, from, to, grade: NOCHE, parent: $("flash"), z: 1,
    box: { left: lx - 10, top: ly - 8, width: 225, height: 104 }, fadeOut: .18 });
  const veil = S.el("div", "shade", p.box); veil.style.background = "rgba(28,24,20,.42)";
  S.ev(q.L.t - .02, "flash", qs.indexOf(q));
  return p;
});

// ── amanecer: vista de Talavera de 1567, palomas, otra vez la vista (cortes secos en el cielo vacío)
const DB = { left: 0, top: 140, width: 540, height: 200 };
const dawnShots = [
  [DAWN + .8, DAWN + 1.95, "talavera-wyngaerde-1567", CALIDO, [1.0, 8, 50], [1.12, 40, 50]],
  [DAWN + 1.95, DAWN + 3.3, "aves-1895-structure", CALIDO, [1.1, 35, 42], [1.3, 45, 40]],
  [DAWN + 3.3, DAWN + 4.6, "talavera-wyngaerde-1567", CALIDO, [1.15, 60, 50], [1.0, 92, 50]],
].map(([t0, t1, f, grade, from, to], i) => {
  S.ev(t0, "dcut", i);
  return S.photo(`../assets/archivo/${f}.jpg`, { t0, t1, from, to, grade, parent: $("dawnph"), z: 1, box: DB });
});

// ── narradora
const subs = ["n1", "n2"].map((id) => S.sub(id, { parent: $("subs"), hot: id === "n2" ? [5] : [] }));

// ── «debemos saber.» y firma
const FLIP = line("n3").t - .5, SHRINK = line("n3").t + 2.5;
const saber = S.saber(FLIP, SHRINK, { a: wordAt("n3", 0), b: wordAt("n3", 1), tag: "Conocimiento en abierto, para cualquiera." });
const firma = S.firma(SHRINK + .42);

window.EVENTS = S.EVENTS.sort((a, b) => a.t - b.t);

window.renderAt = (t) => {
  const k = dawnK(t);
  $("stage").style.setProperty("--bgc", mix(INK, PAPER, k));
  $("stage").style.setProperty("--fgc", k < .5 ? mix(PAPER, INK, k * .6) : mix(PAPER, INK, .7 + .3 * k)); // el trazo salta de claro a oscuro a mitad
  city.draw(t, CITY0, 2.0);
  $("wsv").style.opacity = S.eOut((t - CITY0 - 1.7) / .8);

  // ventanas
  winEls.forEach((r, i) => {
    let on = 0;
    const q = qs.find((x) => x.wi === i);
    if (q && t >= q.L.t) on = 1;
    if (litAt[i] != null && t >= litAt[i]) on = 1;
    if (t >= BLACK) on = 0;
    if (i === LASTWIN && t >= P9.t - .5) on = 1;
    if (t >= DAWN) on = i === LASTWIN || (t >= ABI && i % 3 === 0) ? 1 : 0;
    r.setAttribute("opacity", on);
  });

  // textos de las preguntas
  qs.forEach(({ L, lab, ws }) => {
    const vis = t >= L.t - .05 && t < BLACK;
    lab.style.display = vis ? "block" : "none";
    if (!vis) return;
    lab.style.opacity = t > L.end + .2 ? .32 : 1;
    ws.forEach((w, i) => (w.style.opacity = eOut((t - L.t - L.words[i][1] + .04) / .28)));
  });

  // «¿Y si nos quedamos?»
  const lv = t >= P9.t - .05 && t < DAWN + .3;
  last.style.display = lv ? "block" : "none";
  if (lv) {
    last.style.opacity = 1 - eIO((t - DAWN + .2) / .5);
    lws.forEach((w, i) => (w.style.opacity = eOut((t - P9.t - P9.words[i][1] + .04) / .3)));
  }

  // gráfico en el cielo y gente en la calle
  dCl(eIO((t - DAT) / 1.1)); dCb(eIO((t - DAT) / .8));
  const p = eIO((t - DAT) / 1.1), pts = window.__pts, j = Math.min(pts.length - 1, Math.round(p * (pts.length - 1)));
  $("cm").setAttribute("x", pts[j][0] - 5); $("cm").setAttribute("y", pts[j][1] - 5);
  $("chart").style.opacity = t >= DAT ? 1 - eIO((t - (FLIP - .4)) / .4) : 0;
  PPL.forEach(({ d, x, at }) => {
    const on = t >= at && t < FLIP + .5;
    d.style.display = on ? "block" : "none";
    const kk = stepN(t, at, 6);
    d.style.left = x + Math.min(kk, 12) * 2 + "px"; d.style.top = G - 6 + (kk % 2 && kk < 12 ? -3 : 0) + "px";
  });

  cold_.forEach((f) => f(t)); flashes.forEach((f) => f(t)); dawnShots.forEach((f) => f(t));
  subs.forEach((f) => f(t));
  saber(t);
  firma(t);
};
window.renderAt(0);
})();
</script>
</body>
</html>
